<html lang="es">

<style>
:root{--v:#2a1238;--v2:#4a2466;--oro:#e8b84a;--oro2:#f4d98c;--tinta:#1e1226;--fondo:#f4f1f6;--gris:#6a5f73;--lin:#e4dcea}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.45 Manrope,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,.f{font-family:"Cormorant Garamond",Georgia,serif;margin:0;font-weight:700}
h2{font-size:22px;margin-bottom:10px}
main{max-width:520px;margin:0 auto;padding:0 16px}
section{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 1px 0 var(--lin)}
label,.lbl{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.op{font-weight:600;color:var(--gris)}
input{display:block;width:100%;height:48px;padding:0 14px;font:inherit;border:1px solid #d9d1df;border-radius:12px;background:#fff}
input:focus,button:focus-visible{outline:3px solid var(--oro);outline-offset:1px}

.lbl2{color:var(--gris);font-size:13px;margin-top:10px}.ba{display:flex;align-items:center;gap:8px}.ba b{flex:1;line-height:1.2}

.mj{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;align-items:stretch}.mj h2{font-size:30px}.mj p{margin:0 auto}

.mf{position:absolute;aspect-ratio:400/664}.mf canvas{width:100%;height:auto;display:block}.mf svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bob{animation:bob .7s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-5px)}}
.swy{animation:bob .36s ease-in-out infinite alternate}
.mf .mz,.mf .dr{transform-box:view-box}.mf .mz{transform-origin:306px 300px}.mf .dr{transform-origin:200px 360px}
.mf.hit .mz{animation:mzh .22s ease-out}.mf.hit .dr{animation:drh .22s ease-out}
@keyframes mzh{0%{transform:rotate(0)}35%{transform:rotate(-32deg)}100%{transform:rotate(0)}}@keyframes drh{0%{transform:scale(1)}30%{transform:scale(1.04)}100%{transform:scale(1)}}
.tg{position:absolute;left:50%;top:16%;width:70px;height:70px;margin:-35px 0 0 -35px;border:4px solid var(--oro2);border-radius:50%;z-index:3}
#rs{position:absolute;inset:0;z-index:3;pointer-events:none}

.nt{position:absolute;color:var(--oro2);font-size:22px;opacity:0;animation:nt 2.4s ease-out infinite;z-index:2}@keyframes nt{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-60px)}}
.tun{background:rgba(255,255,255,.1);border-radius:14px;padding:12px}
.bar2{position:relative;height:30px;background:#1d1030;border-radius:8px}.zv{position:absolute;top:0;bottom:0;background:#4aa564;border-radius:6px;opacity:.9}.zy{position:absolute;top:0;bottom:0;background:#e8b84a;opacity:.45;border-radius:6px}
.ag{position:absolute;top:-4px;width:8px;height:38px;background:#fff;border-radius:4px;box-shadow:0 0 8px #fff}
.lb2{display:flex;justify-content:space-between;font-size:11px;opacity:.7;margin-top:4px}
.pies{display:flex;gap:10px}.pie{flex:1;height:70px;font-size:18px;background:rgba(255,255,255,.14);color:#fff;border-radius:14px}.pie.on{background:var(--oro);color:var(--v)}
.padg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.padf{background:rgba(255,255,255,.12);border-radius:14px;padding:6px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;font-weight:700}.padf.on{background:var(--oro);color:var(--v)}
.stp2{position:relative;width:98px;height:150px;overflow:hidden}.stp2 .mf{position:absolute;top:0}
.opc{background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:12px;text-align:left;display:block;width:100%}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cp{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}.c1{background:#fbe9e7;color:#8a1c10}.c2{background:#e1f2e6;color:#1d6236}.c4{background:#efe9f3;color:#4a2466}
.chw{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;z-index:5}
.ttl{position:absolute;left:0;right:0;top:10px;text-align:center;font:700 20px Georgia,serif;color:var(--oro2);z-index:5}
.llu{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;animation:llu .5s linear infinite}@keyframes llu{to{transform:translate(-6px,16px)}}
@media (prefers-reduced-motion:reduce){.bob,.swy,.nt,.llu{animation:none}}
.mlist{max-height:340px;overflow:auto;margin-top:10px;border:1px solid var(--lin);border-radius:12px}.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--lin);margin:0;cursor:pointer}.mrow input{width:22px;height:22px;flex:none;margin:0;padding:0;accent-color:var(--v)}.mrow span:nth-of-type(1){flex:1;min-width:0}.mrow small{display:block;color:var(--gris);font-weight:400}.avj{border-bottom:1px solid var(--lin);padding:10px 0;cursor:pointer}.ajb{margin-top:8px;cursor:auto}.b3x{display:block;width:100%;margin-top:8px;min-height:44px;background:var(--lin);color:var(--v);border-radius:12px;font-weight:700}.b3x.rojo{background:#fbe9e7;color:#8a1c10}.opt2{display:flex;gap:10px;align-items:center;margin-top:12px}.opt2 input{width:22px;height:22px;margin:0;flex:none}.paper{background:#f6efd9!important;color:#1e1226;border:1px solid #cdbf93;box-shadow:inset 0 0 0 4px #f6efd9,inset 0 0 0 5px #cdbf93}.paper .mast{text-align:center;border-bottom:3px double #1e1226;padding-bottom:8px;margin-bottom:6px}.paper .mast small{letter-spacing:.2em;text-transform:uppercase;font-size:10px;color:#6a5f73}.paper .mast h2{font-family:Georgia,'Times New Roman',serif;font-size:24px;margin:2px 0;color:#1e1226;font-weight:900}.mast2{display:flex;justify-content:space-between;font-size:11px;border-top:1px solid #1e1226;margin-top:6px;padding-top:4px;text-transform:uppercase;letter-spacing:.08em}.paper article{padding:10px 0;border-bottom:1px solid #cdbf93}.paper h3{font-family:Georgia,serif;font-size:16px;line-height:1.25;margin:0 0 4px;color:#1e1226}.paper .nota1 h3{font-size:22px}.paper article p{margin:0;font-size:13.5px;line-height:1.45;color:#3a2f44;max-width:none}.paper .nota1 p{column-count:1}.leer{display:block;width:100%;margin-top:12px;min-height:44px;background:#1e1226;color:#f6efd9;border-radius:6px;font-weight:700;font-family:Georgia,serif}.mj .paper{padding:16px;border-radius:12px}.dots{display:flex;gap:8px;justify-content:center}.dots span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}.dots span.on{background:var(--oro)}</style>

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app'), EM = '@bandasfantasy.app';
let ADM = false, P = {}, B = null, tab = 'inicio', F = {tipo: 'Banda de Música', nombre: '', proc: '', esc: 1};
const TIPOS = ['Banda de Música', 'Asociación Musical', 'Sociedad Filarmónica'];
const ic = d => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const SEC = {
  bateria: ['Batería', 80, '<ellipse cx="12" cy="8" rx="8" ry="3"/><path d="M4 8v8c0 1.7 3.6 3 8 3s8-1.3 8-3V8M8 11l-2 6M16 11l2 6"/>'],
  cornetas: ['Cornetas', 100, '<path d="M3 10v4l9 3V7zM12 7l8-3v16l-8-3M6 14l1 5h3"/>'],
  percusion: ['Percusión', 30, '<circle cx="8" cy="13" r="5"/><circle cx="17" cy="9" r="4"/>'],
  madera: ['Viento madera', 0, '<path d="M4 20L20 4"/><circle cx="9" cy="15" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="15" cy="9" r=".8"/>'],
  metal: ['Viento metal', 70, '<path d="M3 11h9M3 13h9M12 8l8-3v14l-8-3z"/>']};
const NAV = [['inicio', 'Inicio', '<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>'], ['contratos', 'Contratos', '<path d="M7 3h8l4 4v14H7zM15 3v4h4M10 12h6M10 16h6"/>'], ['tienda', 'Tienda', '<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/>'], ['ranking', 'Ranking', '<path d="M8 4h8v5a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 13v4M8 20h8"/>']];
const h = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => Number(n).toLocaleString('es-ES') + ' €';
const tot = b => Object.keys(SEC).reduce((a, k) => a + b[k], 0);
const tope = k => P['max_' + k] || Infinity;
const DEF = {bateria: 6, cornetas: 4, percusion: 4, madera: 8, metal: 8};
const escudo = (n, s) => `<img src="escudos/escudo-${String(n || 1).padStart(2, '0')}.png" width="${s}" height="${s}" alt="">`;
const traducir = m => ({'Invalid login credentials': 'Usuario o contraseña incorrectos.', 'User already registered': 'Ese usuario ya existe.'}[m] || m);
const aviso = t => { const e = document.getElementById('aviso'); if (e) { e.textContent = t; e.hidden = !t; } };

function vistaAuth(reg) {
  app.innerHTML = `<main class="auth"><h1 class="f">Bandas Fantasy</h1>
  <p class="lema">Crea tu banda, gana contratos y compite por la Semana Santa.</p>
  <label for="u">Usuario</label><input id="u" autocomplete="username" autocapitalize="none">
  <label for="p">Contraseña</label><input id="p" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}">
  <p id="aviso" class="aviso" hidden></p>
  <button id="go">${reg ? 'Crear cuenta' : 'Entrar'}</button>
  <button class="link" id="alt">${reg ? 'Ya tengo cuenta' : 'Quiero registrarme'}</button></main>`;
  document.getElementById('go').onclick = () => entrar(reg);
  document.getElementById('alt').onclick = () => vistaAuth(!reg);
}

async function entrar(reg) {
  const u = document.getElementById('u').value.trim().toLowerCase(), p = document.getElementById('p').value;
  if (!/^[a-z0-9_]{3,20}$/.test(u)) return aviso('Usuario: de 3 a 20 caracteres, solo letras sin tilde, números o guion bajo.');
  if (p.length < 6) return aviso('La contraseña necesita al menos 6 caracteres.');
  const cred = {email: u + EM, password: p};
  const {data, error} = reg ? await sb.auth.signUp(cred) : await sb.auth.signInWithPassword(cred);
  if (error) return aviso(traducir(error.message));
  if (reg && !data.session) return aviso('Cuenta creada, pero Supabase pide confirmar el correo.');
  init();
}


async function cambiarClave(a, b) {
  if (a.length < 6) return 'La contraseña necesita al menos 6 caracteres.';
  if (a !== b) return 'Las dos contraseñas no coinciden.';
  const {error} = await sb.auth.updateUser({password: a, data: {cambiar_clave: false}});
  return error ? traducir(error.message) : '';
}
function vistaClave() {
  app.innerHTML = `<main class="auth"><h1>Elige tu contraseña</h1><p class="lema">El administrador te ha puesto una contraseña temporal. Elige ahora una nueva que solo sepas tú.</p>
  <label for="c1">Nueva contraseña</label><input id="c1" type="password" autocomplete="new-password">
  <label for="c2">Repítela</label><input id="c2" type="password" autocomplete="new-password">
  <p id="aviso" class="aviso" hidden></p><button id="go">Guardar y entrar</button></main>`;
  document.getElementById('go').onclick = async () => { const r = await cambiarClave(document.getElementById('c1').value, document.getElementById('c2').value); r ? aviso(r) : init(); };
}

async function init() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return vistaAuth(false);
  if (session.user.user_metadata && session.user.user_metadata.cambiar_clave) return vistaClave();
  const {data: ps, error: e1} = await sb.from('parametros').select('*');
  if (e1) { app.innerHTML = '<main><section><h2>No se pudo cargar el juego</h2><p class="nota">' + h(e1.message) + '</p></section></main>'; return; }
  P = {}; ps.forEach(x => P[x.clave] = Number(x.valor));
  const {data: est} = await sb.rpc('sincronizar'); E = est || E;
  { const {data: ad} = await sb.rpc('es_admin'); ADM = ad === true; }
  await sb.rpc('refrescar_dia');
  const {data: b} = await sb.from('bandas').select('*, repertorio(marcha_id, marchas(estilo,propia_de))').eq('id', session.user.id).maybeSingle();
  B = b;
  b ? vistaApp() : vistaCrear();
}

const maxC = n => n < 3 ? 3 : n < 5 ? 4 : n < 7 ? 5 : n < 9 ? 6 : n < 12 ? 7 : n < 15 ? 8 : n < 18 ? 9 : 10;

function tarjeta(x, e, p) {

  const bn = ct ? ct.bandas.nombre : (x.bandas_ficticias ? x.bandas_ficticias.nombre : 'Sin banda');
  let cuerpo;
  if (e === 's') cuerpo = '<div class="est">Sin banda de música. Va en silencio: solo un cabildo extraordinario podría contratar una.</div>';
  else {
    const mot = [B.nivel < x.nivel_min ? 'nivel' : '', c < x.compat_min ? 'compatibilidad' : ''].filter(Boolean).join(' y ');
    let acc;
    if (e === 'm') acc = `<div class="est l">Contrato tuyo. Quedan ${ct.anios} ${ct.anios === 1 ? 'año' : 'años'}.</div>`;
    else if (e === 'o') acc = `<div class="est l">Oferta presentada: se resuelve a las 00:00.</div><button class="of2" data-r="${of.id}">Retirar oferta</button>`;
    else if (e === 'l') acc = E.fase !== 'ensayo' ? '<div class="est">Las ofertas se presentan en el día de ensayo.</div>' : MYJ.has(x.jornada) ? '<div class="est">Ya tienes un contrato ese día.</div>' : OFJ.has(x.jornada) ? '<div class="est">Ya tienes otra oferta ese día.</div>' : `<button class="of" data-h="${x.id}">Presentar oferta</button>`;
    else acc = `<div class="est">Te falta ${mot}. Nivel mínimo ${x.nivel_min}.</div>`;
    cuerpo = `<div class="lbl2">Banda actual</div><div class="ba"><b>${h(bn)}</b><span class="pill" ${ct ? 'style="background:var(--oro2)"' : ''}>${ct ? 'Jugador' : 'Ficticia'}</span></div>
    <div class="cm"><span>Pago por jornada <b>${eur(pagoDe(x, B.nivel))}</b></span><span>${Math.round(horasDe(x) * 10) / 10} h en la calle</span></div>
    <div class="cm"><span>Compatibilidad <b>${c}</b></span><span>mínima ${x.compat_min}</span></div>
    <div class="bw"><div class="barra2"><i style="width:${c}%;background:${c >= x.compat_min ? 'var(--v2)' : '#8d8296'}"></i></div><u style="left:${x.compat_min}%"></u></div>${acc}`;
  }
  return `<section class="hc"><div class="hh"><h2>${h(x.nombre)}</h2><span class="pill p2">${h(x.categoria || '')}</span></div>${cuerpo}</section>`;
}

function modalOferta(x) {
  const k = {'Fácil': 'facil', 'Media': 'media', 'Alta': 'alta'}[x.categoria] || 'extrema';
  const ps = P['saya_' + k], pr = P['regalo_' + k];
  const OP = [['saya', 'Saya para la Virgen', 'Donativo de ' + eur(ps), P.peso_saya, P.pol_saya, ps],
    ['rebaja', 'Rebajar el contrato', P.rebaja_pct + ' % menos de pago durante todo el contrato', P.peso_rebaja, P.pol_rebaja, 0],
    ['regalo', 'Regalo a la hermandad', eur(pr) + ' en enseres', P.peso_regalo, P.pol_regalo, pr]];
  const e = ov(`<h2>${h(x.nombre)}</h2>
  <div class="avo"><b class="f" style="font-size:24px">Solo pagas si ganas</b><br>Si la hermandad elige a otra banda, no se te cobra nada. El dinero queda comprometido, no gastado, hasta el cierre de las 00:00.</div>
  <div id="cl" style="width:100%;max-width:420px;background:rgba(255,255,255,.14);border-radius:14px;padding:14px;text-align:left"></div>
  ${OP.map(([c, t, d, pt]) => `<label class="b3 opt"><input type="checkbox" data-o="${c}"><span><b>${t}</b><br><small>${d}</small></span><span class="pill">+${pt} %</span></label>`).join('')}
  <p id="rs"></p><button class="b2" id="go2">Presentar oferta</button><button class="b3" id="no" style="text-align:center">Cancelar</button>`);
  const f = c => e.querySelector(`[data-o="${c}"]`).checked;
  const calc = () => {
    const s = OP.filter(o => f(o[0])), co = s.reduce((a, o) => a + o[5], 0), ri = s.reduce((a, o) => a + o[4], 0);
    const w = P.peso_limpia + s.reduce((a, o) => a + o[3], 0), b0 = P.prob_sin_rivales / 100;
    const pr1 = Math.round(100 * (b0 + (1 - b0) * (w - P.peso_limpia) / w) * (1 - P.dificultad_peso / 100 * (x.dificultad || 50) / 100));
    document.getElementById('cl').innerHTML = s.length ? '<b>Campaña con ofertas</b><br><small>Cada extra aumenta tu peso frente a otras bandas. El % indica cuánto suma frente a una campaña limpia.</small>'
      : '<b>Campaña limpia</b><br><small>No gastas nada y no hay riesgo de polémica, pero tienes menos peso si otra banda también se presenta.</small>';
    document.getElementById('rs').innerHTML = `Si no hay rivales, tu probabilidad es del ${pr1} %. Si se presentan más bandas, la hermandad elige una de ellas según el peso de cada oferta.<br>Riesgo de polémica: ${ri} %. Dinero comprometido: ${eur(co)} de ${eur(B.dinero)}.`;
    document.getElementById('go2').disabled = co > B.dinero;
  };
  e.querySelectorAll('[data-o]').forEach(i => i.onchange = calc); calc();
  document.getElementById('no').onclick = () => e.remove();
  document.getElementById('go2').onclick = async () => {
    const {error} = await sb.rpc('presentar_oferta', {p_h: x.id, p_saya: f('saya'), p_rebaja: f('rebaja'), p_regalo: f('regalo')});
    e.remove();
    if (error) return aviso(error.message);
    pContratos();
  };
}

async function pContratos() {
  const v = document.getElementById('vista');
  if (!H) {
    v.innerHTML = '<section><h2>Buscar contratos</h2><p class="nota">Cargando…</p></section>';
    const {data, error} = await sb.from('hermandades').select('id,nombre,jornada,categoria,nivel_min,compat_min,silencio,pct_funebre,dificultad,hora_salida,hora_recogida,bandas_ficticias(nombre)').order('id');
    if (error) return aviso(error.message);
    H = data;
  }
  const [rc, ro] = await Promise.all([sb.from('contratos').select('hermandad_id,banda_id,anios,bandas(nombre)'), sb.from('ofertas').select('id,hermandad_id,prioridad')]);
  C = {}; (rc.data || []).forEach(c => C[c.hermandad_id] = c);
  O = {}; (ro.data || []).forEach(o => O[o.hermandad_id] = o);
  const mios = H.filter(x => C[x.id] && C[x.id].banda_id === B.id);
  MYJ = new Set(mios.map(x => x.jornada)); OFJ = new Set(H.filter(x => O[x.id]).map(x => x.jornada));
  const ofs = Object.values(O).sort((a, b) => a.prioridad - b.prioridad), libres = Math.max(0, maxC(B.nivel) - mios.length);
  const p = perfil();
  const est = x => x.silencio ? 's' : C[x.id] && C[x.id].banda_id === B.id ? 'm' : B.nivel < x.nivel_min || compat(x, p) < x.compat_min ? 'b' : O[x.id] ? 'o' : 'l';
  const lista = H.filter(x => fil === 'todas' || est(x) === 'l' || est(x) === 'o');
  v.innerHTML = `<section><h2>Buscar contratos</h2><div class="res"><div><span class="num">${mios.length} de ${maxC(B.nivel)}</span><small>contratos</small></div><div><span class="num">${Object.keys(O).length} de ${P.max_ofertas}</span><small>ofertas</small></div></div>
  <p class="nota">Solo puedes tocar con una hermandad por jornada. Las ofertas se presentan en el día de ensayo y se resuelven a las 00:00.</p></section>
  ${ofs.length ? `<section><h2>Tus ofertas por orden de preferencia</h2>
  <p class="nota">Se resuelven de la primera a la última. ${libres < ofs.length ? `<b>Solo te caben ${libres} contrato${libres === 1 ? '' : 's'} más: si ganas más, se descartan las últimas de tu lista.</b>` : `Te caben ${libres} contrato${libres === 1 ? '' : 's'} más.`}</p>
  ${ofs.map((o, i) => `<div class="fila"><span class="pill ${i < libres ? 'p2' : ''}" style="min-width:26px;text-align:center">${i + 1}</span><div style="flex:1"><b style="display:block">${h(H.find(x => x.id === o.hermandad_id).nombre)}</b><small style="color:var(--gris)">${H.find(x => x.id === o.hermandad_id).jornada}${i >= libres ? ' · no cabe' : ''}</small></div>
  <button data-u="${i}" aria-label="Subir" ${i === 0 ? 'disabled' : ''} style="width:44px;height:44px;border:0;border-radius:12px;background:#efe6f7;color:#2a1238;font:700 18px inherit;margin-left:6px">▲</button>
  <button data-d="${i}" aria-label="Bajar" ${i === ofs.length - 1 ? 'disabled' : ''} style="width:44px;height:44px;border:0;border-radius:12px;background:#efe6f7;color:#2a1238;font:700 18px inherit;margin-left:6px">▼</button></div>`).join('')}</section>` : ''}
  <div class="chips">${[['todas', 'Todas'], ['libres', 'A tu alcance']].map(([k, n]) => `<button class="seg ${fil === k ? 'on' : ''}" data-f="${k}" aria-pressed="${fil === k}">${n}</button>`).join('')}</div>
  <h2 class="jh">Contratos actuales</h2>
  ${mios.length ? mios.slice().sort((x, y) => JORN.indexOf(x.jornada) - JORN.indexOf(y.jornada)).map(x => tarjeta(x, 'm', p)).join('') : '<section><p class="nota" style="margin:0">Todavía no tienes contratos. Presenta ofertas más abajo.</p></section>'}
  ${JORN.map(j => { const hs = lista.filter(x => x.jornada === j); return hs.length ? `<h2 class="jh">${j}</h2>` + hs.map(x => tarjeta(x, est(x), p)).join('') : ''; }).join('')}`;
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { fil = b.dataset.f; pContratos(); });
  v.querySelectorAll('[data-h]').forEach(b => b.onclick = () => modalOferta(H.find(x => x.id === +b.dataset.h)));
  const mover = async (i, d) => { const ids = ofs.map(o => o.id); [ids[i], ids[i + d]] = [ids[i + d], ids[i]]; const {error} = await sb.rpc('ordenar_ofertas', {p_ids: ids}); if (error) aviso(error.message); pContratos(); };
  v.querySelectorAll('[data-u]').forEach(b => b.onclick = () => mover(+b.dataset.u, -1));
  v.querySelectorAll('[data-d]').forEach(b => b.onclick = () => mover(+b.dataset.d, 1));
  v.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => { await sb.from('ofertas').delete().eq('id', +b.dataset.r); pContratos(); });
}

const DEC = {sale: 'Ha salido y no ha llovido', sale_moja: 'Ha salido y se ha mojado', se_recoge: 'Se ha recogido antes de tiempo',
  refugia: 'Se ha refugiado en la Catedral y vuelve mañana temprano', no_sale: 'No ha salido'};
const FASES = ['Salida', 'Recorrido', 'Carrera oficial', 'Recogida'];
const filaEf = e => e > 0 ? `+${e}` : `${e}`;

async function semanaDatos() {
  const [rc, rt, ra] = await Promise.all([
    sb.from('contratos').select('hermandad_id,hermandades(nombre,jornada,hora_salida,hora_recogida)').eq('banda_id', B.id),
    sb.rpc('tiempo_semana'), sb.from('actuaciones').select('*').eq('banda_id', B.id).eq('temporada', E.temporada)]);
  const T = {}; (rt.data || []).forEach(x => T[x.jornada] = x.prevision);
  const A = {}; (ra.data || []).forEach(x => A[x.hermandad_id] = x);
  const cs = (rc.data || []).sort((x, y) => JORN.indexOf(x.hermandades.jornada) - JORN.indexOf(y.hermandades.jornada));
  return {cs, T, A};
}
const pendiente = S => S.cs.find(c => !S.A[c.hermandad_id]);
const sigDe = S => { const c = pendiente(S); return c ? {c, prev: S.T[c.hermandades.jornada]} : null; };
const datosActuacion = (a, hm) => ({...a.detalle, decision: a.decision, llueve: a.llueve, prevision: a.prevision, refuerzos: a.refuerzos, ingresos: a.ingresos,
  coste: a.coste, xp: a.xp, prestigio: a.prestigio, satisfaccion: a.satisfaccion, retraso: a.retraso, auto: a.auto, hermandad: hm.nombre, jornada: hm.jornada});

async function semanaLista() {
  const el = document.getElementById('sj'); if (!el) return;
  el.innerHTML = '<p class="nota">Cargando jornadas…</p>';
  const S = await semanaDatos(), sg = sigDe(S), hechas = S.cs.filter(c => S.A[c.hermandad_id]).length;
  if (!S.cs.length) { el.innerHTML = '<p class="nota" style="margin:0">No tienes contratos esta Semana Santa.</p>'; return; }
  el.innerHTML = S.cs.map(c => { const a = S.A[c.hermandad_id], hm = c.hermandades;
    return `<div class="fila"><div style="flex:1"><b style="display:block">${h(hm.nombre)}</b><small style="color:var(--gris)">${hm.jornada} · ${a ? 'cobrado ' + eur(a.ingresos) : 'lluvia prevista ' + (S.T[hm.jornada] ?? '?') + ' %'}</small></div>
    ${a ? `<button class="of2" data-j="${c.hermandad_id}" style="width:auto;padding:0 14px;margin:0">Ver crónica</button>` : '<span class="pill">Pendiente</span>'}</div>`; }).join('')
    + (sg ? `<button class="fund" id="emp" style="margin-top:12px">${hechas ? 'Continuar la Semana Santa' : 'Empezar la Semana Santa'}</button>`
      : `<button class="fund" id="res" style="margin-top:12px">Resumen de la Semana Santa</button>`);
  el.querySelectorAll('[data-j]').forEach(b => b.onclick = () => {
    const c = S.cs.find(x => x.hermandad_id === +b.dataset.j); cronica(datosActuacion(S.A[c.hermandad_id], c.hermandades), sigDe(S));
  });
  const e1 = document.getElementById('emp'); if (e1) e1.onclick = () => previaJornada(sg.c, sg.prev);
  const e2 = document.getElementById('res'); if (e2) e2.onclick = () => resumen(S);
}

function resumen(S) {
  const f = S.cs.map(c => ({c, a: S.A[c.hermandad_id]})).filter(x => x.a);
  const sum = k => f.reduce((t, x) => t + x.a[k], 0);
  ov(`<h2>Resumen de la Semana Santa</h2>
  <div class="avo">${f.map(({c, a}) => `<div style="padding:8px 0;border-top:1px solid #e4d8b8"><b>${h(c.hermandades.nombre)}</b> <small>· ${c.hermandades.jornada}</small><br>
    <small>${eur(a.ingresos)}${a.coste ? ' · refuerzos −' + eur(a.coste) : ''} · +${a.xp} xp · prestigio ${a.prestigio > 0 ? '+' : ''}${a.prestigio}</small></div>`).join('')}</div>
  <div class="avo"><b class="f" style="font-size:24px">Total</b>
  <div class="fila2"><span>Ingresos</span><span>${eur(sum('ingresos'))}</span></div>
  <div class="fila2"><span>Refuerzos</span><span>−${eur(sum('coste'))}</span></div>
  <div class="fila2"><span>Experiencia</span><span>+${sum('xp')} xp</span></div>
  <div class="fila2"><span>Prestigio</span><span>${sum('prestigio') > 0 ? '+' : ''}${sum('prestigio')}</span></div>
  <p class="nota" style="margin-top:10px;color:#4a3a5a">Los gastos de la banda de la temporada se descuentan a las 00:00.</p></div>
  <button class="b2" id="ok">Cerrar</button>`);
  document.getElementById('ok').onclick = () => { document.getElementById('ov').remove(); init(); };
}

async function previaJornada(c, prev) {
  const {data: bb} = await sb.from('bandas').select('dinero').eq('id', B.id).single(); if (bb) B.dinero = bb.dinero;
  const hm = c.hermandades; let n = 0;
  const hs = t => t ? String(t).slice(0, 5) : '—';
  const e = ov(`<h2>${h(hm.nombre)}</h2><p>${hm.jornada}</p>
  <div class="avo"><b class="f" style="font-size:24px">Previsión de lluvia: ${prev} %</b><br>La hermandad decide si sale según el cielo. Si llueve, llueve para toda la ciudad.<br><small>Salida oficial ${hs(hm.hora_salida)} · Recogida oficial ${hs(hm.hora_recogida)}</small></div>
  <div class="avo"><b>Refuerzos de última hora</b><br><small>${P.refuerzo_precio} € por músico. Ayudan a que suene mejor.</small>
  <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px"><button class="b3" id="rm" style="width:56px;text-align:center;padding:0">−</button><b class="f" style="font-size:32px" id="rn">0</b><button class="b3" id="rp" style="width:56px;text-align:center;padding:0">+</button></div>
  <p id="rc" style="margin-top:8px;text-align:center"></p></div>
  <button class="b2" id="go3">¡Que suene la banda!</button><button class="b3" id="no" style="text-align:center">Volver</button>`);
  const pintar = () => { document.getElementById('rn').textContent = n; document.getElementById('rc').textContent = n * P.refuerzo_precio + ' € de ' + eur(B.dinero); };
  pintar();
  document.getElementById('rm').onclick = () => { n = Math.max(0, n - 1); pintar(); };
  document.getElementById('rp').onclick = () => { if (n < P.refuerzo_max && (n + 1) * P.refuerzo_precio <= B.dinero) n++; pintar(); };
  document.getElementById('no').onclick = () => { e.remove(); init(); };
  document.getElementById('go3').onclick = async () => {
    document.getElementById('go3').disabled = true;
    const {data, error} = await sb.rpc('jugar_jornada', {p_h: c.hermandad_id, p_ref: n});
    if (error) { e.remove(); return aviso(error.message); }
    const S = await semanaDatos();
    cronica(data, sigDe(S), S);
  };
}

function cronica(d, sig, S) {
  const pag = [];
  if (d.decision === 'no_sale') pag.push('nosale');
  else FASES.forEach(f => { if ((d.tramos || []).some(t => t.momento === f)) pag.push(f); });
  pag.push('fin');
  let i = 0;
  const hs = t => t || '—';
  const pintar = () => {
    const pg = pag[i], ultimo = i === pag.length - 1;
    let cuerpo;
    if (pg === 'nosale') cuerpo = `<div class="avo"><b class="f" style="font-size:24px">${d.llueve ? 'Hoy ha llovido en toda la ciudad' : 'No ha llovido, pero la hermandad no ha salido'}</b><br>La previsión era del ${d.prevision} % y la Junta ha decidido no arriesgar.</div>
      ${(d.otras || []).length ? `<div class="avo"><b>Qué han decidido las demás</b>${d.otras.slice(0, 8).map(o => `<div class="fila2"><span>${h(o.hermandad)}</span><span>${DEC[o.decision] || o.decision}</span></div>`).join('')}</div>` : ''}`;
    else if (pg === 'fin') cuerpo = `<div class="avo"><b class="f" style="font-size:24px">${DEC[d.decision]}</b>
      <div class="fila2"><span>Cobrado</span><span>${eur(d.ingresos)}</span></div>
      ${d.coste ? `<div class="fila2"><span>Refuerzos</span><span>−${eur(d.coste)}</span></div>` : ''}
      <div class="fila2"><span>Experiencia</span><span>+${d.xp} xp</span></div>
      <div class="fila2"><span>Prestigio</span><span>${d.prestigio > 0 ? '+' : ''}${d.prestigio}</span></div>
      ${d.decision !== 'no_sale' && !d.auto ? `<div class="fila2"><span>Satisfacción de la hermandad</span><span>${d.satisfaccion} %</span></div>
      <div class="fila2"><span>Recogida</span><span>${hs(d.hora_recogida)} (oficial ${hs(d.hora_recogida_oficial)})</span></div>` : ''}
      ${d.auto ? '<p class="nota" style="color:#4a3a5a">Esta jornada se resolvió sola porque no te conectaste: cobraste la mitad.</p>' : ''}</div>
      ${d.decision === 'refugia' ? '<div class="avo">La vuelta es mañana temprano desde la Catedral. No gasta acciones.</div>' : ''}`;
    else cuerpo = escenaCronica(pg, d.llueve, d.llueve ? 'Lluvia' : 'Despejado') + (d.tramos || []).filter(t => t.momento === pg).map(t => `<div class="avo"><small><b>${h(t.tramo)}</b></small><br>${h(t.texto)}<br><span class="pill" style="margin-top:6px;display:inline-block;background:${t.efecto > 0 ? '#e1f2e6' : t.efecto < 0 ? '#fbe9e7' : '#efe9f3'};color:${t.efecto > 0 ? '#1d6236' : t.efecto < 0 ? '#8a1c10' : '#4a2466'}">Satisfacción ${filaEf(t.efecto)}</span></div>`).join('');
    const tit = pg === 'fin' ? 'Jornada completada' : pg === 'nosale' ? 'No sale' : pg;
    const botones = !ultimo ? '<button class="b2" id="sig">Siguiente</button>'
      : (sig ? `<button class="b2" id="nx">Siguiente contrato (${h(sig.c.hermandades.nombre)} - ${sig.c.hermandades.jornada})</button>`
             : '<button class="b2" id="rs">Resumen de la Semana Santa</button>') + '<button class="b3" id="cl2" style="text-align:center">Cerrar</button>';
    const ove = ov(`<h2>${tit}</h2><p>${h(d.hermandad)} · ${d.jornada}</p>${cuerpo}${botones}`); pintaBanda(ove);
    const cerrar = () => { document.getElementById('ov').remove(); init(); };
    if (!ultimo) document.getElementById('sig').onclick = () => { i++; pintar(); };
    else {
      document.getElementById('cl2').onclick = cerrar;
      if (sig) document.getElementById('nx').onclick = () => previaJornada(sig.c, sig.prev);
      else document.getElementById('rs').onclick = async () => resumen(S || await semanaDatos());
    }
  };
  pintar();
}

let IMP = null;
const xpDe = n => 100 * (n - 1) ** 2;
const ov = html => { let e = document.getElementById('ov'); if (!e) { e = document.createElement('div'); e.id = 'ov'; e.className = 'ov'; document.body.appendChild(e); } e.innerHTML = html; return e; };

// ---- 1. El pulso (bombo)
function pulso() {
  const N = 12, GAP = 800, D = 1200, beats = [], taps = []; let timers = [], fin_ = null;
  const e = mjShell('El pulso', 'Toca el bombo justo cuando el aro llegue al círculo. Los dos primeros son de calentamiento.',
    `<div class="stg" style="height:340px;background:radial-gradient(ellipse at 50% 30%,#7a4a9a 0%,#2a1238 72%)"><div class="tg"></div><div id="rs"></div><div id="fb" class="fbk"></div>${mfig('bombo_anim', 170, 94, -24, 0, 'dm')}</div><button class="b2" id="tap" style="height:64px;font-size:20px">¡Bombo!</button>`,
    () => enviar(30));
  const enviar = hecho(() => timers.forEach(clearTimeout)), t0 = performance.now() + 1500, rs = document.getElementById('rs'), fb = document.getElementById('fb'), dm = e.querySelector('.dm');
  const golpea = () => { dm.classList.remove('hit'); void dm.offsetWidth; dm.classList.add('hit'); };
  document.getElementById('tap').onpointerdown = () => {
    const t = performance.now(); taps.push(t); snd('bombo'); golpea();
    const d = Math.min(...beats.map(b => Math.abs(t - b))), msg = d < 120 ? '¡Justo!' : d < 250 ? 'Bien' : d < 400 ? 'Casi' : '';
    if (msg) { fb.textContent = msg; fb.className = 'fbk on'; setTimeout(() => fb.className = 'fbk', 400); }
  };
  for (let i = 0; i < N; i++) {
    const b = t0 + i * GAP; beats.push(b);
    timers.push(setTimeout(() => { const r = document.createElement('span'); r.className = 'rg2'; r.style.animationDuration = D + 'ms'; rs.appendChild(r); setTimeout(() => r.remove(), D + 200); }, b - D - performance.now()));
  }
  timers.push(setTimeout(() => {
    let s = 0; beats.slice(2).forEach(b => { const d = Math.min(999, ...taps.map(x => Math.abs(x - b))); s += Math.max(0, 1 - d / 350); });
    enviar(Math.round(100 * s / (N - 2)));
  }, t0 + (N - 1) * GAP + 600 - performance.now()));
}

// ---- 3. Marcar el paso
function paso() {
  const N = 16; let timers = [], cues = [], taps = [], vivo = true;
  const enviar = hecho(() => timers.forEach(clearTimeout));
  const fil = (n, w, b, ini, paso_) => Array.from({length: n}, (_, i) => mfig(i % 2 ? 'caja' : 'clarinete', w, ini + i * paso_, b, (i % 2) * .35, 'swy')).join('');
  mjShell('Marcar el paso', 'Toca el pie que se ilumina, izquierdo o derecho. El ritmo irá cambiando.',
    `<div class="stg" style="background:radial-gradient(ellipse at 50% 20%,#7a4a9a 0%,#2a1238 70%)">${[0, 1, 2, 3].map(i => mfig(i % 2 ? 'caja' : 'clarinete', 74, 8 + i * 86, 60, i * .17, 'swy')).join('')}${[0, 1, 2, 3].map(i => mfig(i === 1 ? 'bombo_anim' : i % 2 ? 'caja' : 'clarinete', 92, -6 + i * 90, 0, i * .17 + .1, 'swy')).join('')}<div id="fb" class="fbk"></div></div>
    <div class="pies"><button class="pie" id="pl" data-l="0">Izquierdo</button><button class="pie" id="pr" data-l="1">Derecho</button></div><p class="nota" style="color:#d8c9e3;margin:0" id="pg">Prepárate…</p>`, () => enviar(30));
  const t0 = performance.now() + 1500; let t = t0;
  for (let i = 0; i < N; i++) { cues.push({t, lado: i % 2}); t += 720 - i * 12; }
  const pies = [document.getElementById('pl'), document.getElementById('pr')];
  cues.forEach((c, i) => timers.push(setTimeout(() => {
    if (!vivo) return; pies[c.lado].classList.add('on'); snd(i % 4 === 0 ? 'bombo' : 'tic'); setTimeout(() => pies[c.lado].classList.remove('on'), 220);
    const pg = document.getElementById('pg'); if (pg) pg.textContent = `Paso ${i + 1} de ${N}`;
  }, c.t - performance.now())));
  pies.forEach(p => p.onpointerdown = () => {
    const tt = performance.now(), l = +p.dataset.l; taps.push({t: tt, l}); snd('caja');
    const fb = document.getElementById('fb'); if (!fb) return;
    const c = cues.map(c => ({c, d: Math.abs(c.t - tt)})).sort((a, b) => a.d - b.d)[0];
    const ok = c.c.lado === l && c.d < 320; fb.textContent = !ok ? 'Fallo' : c.d < 120 ? '¡Justo!' : 'Bien'; fb.className = 'fbk on'; setTimeout(() => fb.className = 'fbk', 350);
  });
  timers.push(setTimeout(() => {
    vivo = false; let s = 0, usados = new Set();
    cues.forEach(c => {
      let mejor = 0, idx = -1;
      taps.forEach((x, k) => { if (usados.has(k) || x.l !== c.lado) return; const v = Math.max(0, 1 - Math.abs(x.t - c.t) / 320); if (v > mejor) { mejor = v; idx = k; } });
      if (idx >= 0) usados.add(idx); s += mejor;
    });
    enviar(Math.round(100 * s / N));
  }, cues[N - 1].t + 700 - performance.now()));
}

// ---- 4. Repetir la frase
function frase() {
  const K = ['caja', 'bombo_anim', 'corneta', 'clarinete'], NOM = ['Caja', 'Bombo', 'Corneta', 'Clarinete'], NT = [0, 0, 440, 330], RN = 5; let seq = [], ronda = 0, entrada = 0, turno = false, acabado = false, puntos = 0;
  const enviar = hecho(() => { acabado = true; });
  const e = mjShell('Repetir la frase', 'Escucha la frase y repítela tocando los instrumentos en el mismo orden.',
    `<div class="padg">${K.map((k, i) => `<button class="padf" data-p="${i}"><div class="stp2">${mfig(k, 358, 0, 0, 0, 'pf')}</div><span>${NOM[i]}</span></button>`).join('')}</div><p class="nota" style="color:#f4d98c;font-weight:700;margin:0" id="ms">Escucha…</p><p class="nota" style="color:#d8c9e3;margin:0" id="rr">Ronda 1 de ${RN}</p>`, () => enviar(30));
  const pads = [...e.querySelectorAll('.padf')], msg = t => { const m = document.getElementById('ms'); if (m) m.textContent = t; };
  const toca = i => { if (i === 1) { const f = pads[1].querySelector('.mf'); f.classList.remove('hit'); void f.offsetWidth; f.classList.add('hit'); } snd(['caja', 'bombo', 'corneta', 'clarinete'][i], NT[i]); pads[i].classList.add('on'); setTimeout(() => pads[i].classList.remove('on'), 260); };
  const reproduce = async () => {
    turno = false; msg('Escucha…'); await sleep(700);
    for (const i of seq) { if (acabado) return; toca(i); await sleep(620); }
    entrada = 0; turno = true; msg('¡Tu turno!');
  };
  const nueva = () => { while (seq.length < ronda + 3) seq.push(Math.floor(Math.random() * 4)); document.getElementById('rr').textContent = `Ronda ${ronda + 1} de ${RN}`; reproduce(); };
  pads.forEach((p, i) => p.onpointerdown = () => {
    if (!turno || acabado) return; toca(i);
    if (i !== seq[entrada]) { snd('mal'); turno = false; msg('Fallo'); puntos += Math.round(20 * entrada / seq.length); return setTimeout(() => enviar(Math.min(100, puntos)), 900); }
    entrada++;
    if (entrada === seq.length) { turno = false; puntos += 20; ronda++; snd('ok'); if (ronda >= RN) { msg('¡Perfecto!'); return setTimeout(() => enviar(Math.min(100, puntos)), 900); } msg('¡Bien!'); setTimeout(nueva, 900); }
  });
  nueva();
}

// ======== Uniformes (imágenes recoloreables) ========
const UN = {}, GO = {}, GPOS = {1: [140, 42], 2: [140, 20], 3: [140, 20]};
const PAL = ['#14213d', '#1f3a8a', '#14532d', '#7a1020', '#5b2c83', '#e8e4d8', '#1b1b1f', '#5a3a1a', '#8a8a8a', '#e8c34a'];
const UDEF = {modelo: 2, chaqueta: '#7a1020', pantalon: '#1b1b1f', corbata: '#e8c34a', cinturon: '#5a3a1a', metal: 'oro', gorra: '#7a1020'};
const cargaImg = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('No se pudo cargar ' + src)); i.src = src; });
const pixeles = img => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const x = c.getContext('2d', {willReadFrequently: true}); x.drawImage(img, 0, 0); return x.getImageData(0, 0, c.width, c.height); };
const hexRgb = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
const pct = (arr, q) => { if (!arr.length) return 1; arr.sort((a, b) => a - b); return arr[Math.floor(arr.length * q)] || 1; };
function recursoZonas(src, zsrc) {
  return (async () => {
    const [a, z] = await Promise.all([cargaImg(src), cargaImg(zsrc)]);
    const A = pixeles(a), Z = pixeles(z), n = A.width * A.height, lum = new Float32Array(n), por = {1: [], 2: [], 3: [], 4: [], 5: [], 6: []};
    for (let i = 0; i < n; i++) { lum[i] = .3 * A.data[i * 4] + .59 * A.data[i * 4 + 1] + .11 * A.data[i * 4 + 2]; const zn = Z.data[i * 4]; if (por[zn]) por[zn].push(lum[i]); }
    const ref = {}; for (const k in por) ref[k] = pct(por[k], k == 5 ? .7 : .6);
    return {A, Z, lum, ref};
  })();
}
function pinta(R, u, tintes) {
  const {A, Z, lum, ref} = R, out = new ImageData(new Uint8ClampedArray(A.data), A.width, A.height), n = A.width * A.height;
  for (let i = 0; i < n; i++) {
    const zn = Z.data[i * 4], o = i * 4;
    if (tintes[zn]) { const f = Math.max(.35, Math.min(1.6, lum[i] / ref[zn])), c = tintes[zn]; out.data[o] = Math.min(255, c[0] * f); out.data[o + 1] = Math.min(255, c[1] * f); out.data[o + 2] = Math.min(255, c[2] * f); }
    else if (zn === 5 && u.metal === 'plata') { const f = Math.pow(Math.max(.01, lum[i] / ref[5]), .9); out.data[o] = Math.min(255, 200 * f); out.data[o + 1] = Math.min(255, 205 * f); out.data[o + 2] = Math.min(255, 212 * f); }
  }
  return out;
}
async function dibujarUni(canvas, u) {
  u = Object.assign({}, UDEF, u || {});
  const m = u.modelo;
  const R = await (UN[m] = UN[m] || recursoZonas(`uniformes/uniforme${m}.png`, `uniformes/uniforme${m}_zonas.png`));
  const t = {1: hexRgb(u.chaqueta), 2: hexRgb(u.pantalon)}; if (m >= 2) t[3] = hexRgb(u.corbata); if (m === 3) t[4] = hexRgb(u.cinturon);
  canvas.width = R.A.width; canvas.height = R.A.height;
  const ctx = canvas.getContext('2d'); ctx.putImageData(pinta(R, u, t), 0, 0);
  if (u.gorra) {
    const G = await (GO.g = GO.g || recursoZonas('uniformes/gorra.png', 'uniformes/gorra_zonas.png'));
    const tmp = document.createElement('canvas'); tmp.width = G.A.width; tmp.height = G.A.height;
    tmp.getContext('2d').putImageData(pinta(G, u, {6: hexRgb(u.gorra)}), 0, 0);
    ctx.drawImage(tmp, GPOS[m][0], GPOS[m][1]);
  }
}
const uniHtml = (id, w) => `<canvas class="uni" data-uid="${id}" style="width:${w}px;height:${Math.round(w * 664 / 400)}px"></canvas>`;
async function pintarUnis(mapa, raiz) {
  for (const c of (raiz || document).querySelectorAll('canvas.uni')) {
    const u = mapa[c.dataset.uid]; if (!u) continue;
    try { await dibujarUni(c, u); } catch (e) { c.replaceWith(Object.assign(document.createElement('small'), {textContent: 'Uniforme no disponible'})); }
  }
}

  <button class="of2" id="mm">Ver y montar marchas</button><button class="of2" id="cm">Componer una marcha</button></section>
  <section><h2>Reglas</h2><p class="nota" style="margin:0 0 8px">Un repaso rápido de cómo funciona el juego.</p><button class="of2" id="vrg">Ver las reglas</button></section>
  <section><h2>Contraseña</h2><label for="cp1">Nueva contraseña</label><input id="cp1" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"><label for="cp2">Repítela</label><input id="cp2" type="password" autocomplete="new-password"><button class="of2" id="cpb">Cambiar contraseña</button></section>`;
  const redo = () => { pMiBanda(); };
  document.getElementById('vrg').onclick = () => reglas(false);
  document.getElementById('cpb').onclick = async () => { const r = await cambiarClave(document.getElementById('cp1').value, document.getElementById('cp2').value); if (r) return aviso(r); aviso(''); document.getElementById('cp1').value = document.getElementById('cp2').value = ''; alert('Contraseña cambiada.'); };
  v.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { FN.nombre = document.getElementById('nn').value; FN.proc = document.getElementById('np').value; FN.tipo = b.dataset.t; redo(); });
  const pv = () => { FN.nombre = document.getElementById('nn').value; FN.proc = document.getElementById('np').value; document.getElementById('pv').textContent = full(); document.getElementById('gn').disabled = ya || !full() || full() === B.nombre; };
  document.getElementById('nn').oninput = pv; document.getElementById('np').oninput = pv;
  document.getElementById('gn').onclick = async () => {
    const {error} = await sb.rpc('cambiar_nombre', {p_tipo: FN.tipo, p_nombre: FN.nombre, p_procedencia: FN.proc});
    if (error) return aviso(error.message);
    FN = null; await init();
  };
  v.querySelectorAll('[data-e]').forEach(b => b.onclick = async () => {
    const {error} = await sb.rpc('cambiar_escudo', {p_escudo: +b.dataset.e});
    if (error) return aviso(error.message);
    await init();
  });
  v.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { U.modelo = +b.dataset.m; redo(); });
  v.querySelectorAll('.sw[data-k]').forEach(b => b.onclick = () => { U[b.dataset.k] = b.dataset.c; redo(); });
  v.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => { U.metal = b.dataset.mt; redo(); });
  v.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { U.gorra = b.dataset.g === '1' ? (U.gorra || '#7a1020') : null; redo(); });
  document.getElementById('gu').onclick = async () => {
    const {error} = await sb.rpc('guardar_uniforme', {p: U});
    if (error) return aviso(error.message);
    U = null; await init();
  };
  document.getElementById('cm').onclick = () => { MBACK = 'mibanda'; volver({v: 'componer'}); };
  document.getElementById('mm').onclick = () => { MS = new Set(); MBACK = 'mibanda'; volver({v: 'montaje'}); };
  const mapa = {ed: U}; [1, 2, 3].forEach(m => mapa['m' + m] = Object.assign({}, U, {modelo: m, gorra: null}));
  pintarUnis(mapa, v);
}

let MBACK = 'mibanda', MS = new Set(), MF = 'todas', MT = 'montar', CAT = null;
async function pMontaje() {
  const v = document.getElementById('vista');
  if (!CAT) {
    v.innerHTML = '<section><p class="nota">Cargando marchas…</p></section>';
    const {data, error} = await sb.from('marchas').select('id,titulo,compositor,estilo,propia_de,dedicatoria').order('titulo');
    if (error) return aviso(error.message);
    CAT = data;
  }
  const mias = new Set((B.repertorio || []).map(r => r.marcha_id)), nrep = mias.size, max = MAXREP(), por = P.montajes_por_accion || 2, pr = P.precio_montaje || 150;
  const ens = E.fase === 'ensayo', n = MS.size, libres = max - nrep;
  const base = CAT.filter(m => MT === 'montar' ? !m.propia_de : MT === 'pro' ? mias.has(m.id) && m.propia_de : mias.has(m.id));
  const lista = base.filter(m => MF === 'todas' || (MF === 'fun' ? m.estilo === 'Fúnebre' : m.estilo === 'Alegre'));
  const fila = m => {
    const tengo = mias.has(m.id), sel = MS.has(m.id);
    const btn = MT === 'montar' ? (tengo ? '<button class="mini off" disabled>Ya la tienes</button>' : `<button class="mini ${sel ? 'sel' : ''}" data-id="${m.id}">${sel ? 'Elegida' : 'Elegir'}</button>`) : '';
    return `<div class="fila"><div style="flex:1;min-width:0"><b style="display:block">${h(m.titulo)}</b><small style="color:var(--gris)">${m.propia_de ? 'Propia' + (m.dedicatoria ? ' · ' + h(m.dedicatoria) : '') : h(m.compositor || '')}</small></div><span class="pill ${m.estilo === 'Fúnebre' ? 'p2' : ''}">${m.estilo}</span>${btn}</div>`;
  };
  v.innerHTML = `<section style="background:linear-gradient(160deg,#2a1238,#4a2466);color:#fff"><div class="res"><div><span class="num" style="color:var(--oro2)">${nrep}</span><small style="color:#d8c9e3">marchas en repertorio</small></div><div><span class="num" style="color:var(--oro2)">${max}</span><small style="color:#d8c9e3">máximo en repertorio</small></div></div>
  <p class="nota" style="color:#d8c9e3;margin-top:10px">Cada marcha cuesta ${eur(pr)} y con 1 acción montas hasta ${por}. Solo en día de ensayo (te quedan ${B.acciones} acciones).</p></section>
  <div class="tabs3"><button class="${MT === 'montar' ? 'on' : ''}" data-mt="montar">Montar</button><button class="${MT === 'mi' ? 'on' : ''}" data-mt="mi">Mi repertorio</button><button class="${MT === 'pro' ? 'on' : ''}" data-mt="pro">Propias</button></div>
  <section><div class="bt" style="margin-bottom:8px">${[['todas', 'Todas'], ['fun', 'Fúnebres'], ['ale', 'Alegres']].map(([k, t]) => `<button class="seg ${MF === k ? 'on' : ''}" data-f="${k}">${t}</button>`).join('')}</div>
  ${lista.map(fila).join('') || (MT === 'pro' ? '<p class="nota">Todavía no has compuesto ninguna marcha.</p>' : '<p class="nota">No hay marchas.</p>')}
  <p class="nota">${CAT.filter(m => !m.propia_de).length} marchas en el catálogo · te caben ${libres} más · máximo ${por} por acción</p></section>
  <button class="of2" id="vb">${MBACK === 'tienda' ? 'Volver a la Tienda' : 'Volver a Mi banda'}</button>
  ${MT === 'montar' ? `<div class="barra-fija"><button class="of" id="mn" ${!n || !ens || B.acciones < 1 || B.dinero < n * pr || n > libres ? 'disabled' : ''}>${n ? `Montar ${n} marcha${n > 1 ? 's' : ''} (1 acción · ${eur(n * pr)})` : 'Elige hasta ' + por + ' marchas'}</button></div>` : ''}`;
  v.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => { MT = b.dataset.mt; pMontaje(); });
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { MF = b.dataset.f; pMontaje(); });
  v.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
    const id = +b.dataset.id; if (MS.has(id)) MS.delete(id); else { if (MS.size >= por) return aviso('Solo puedes elegir ' + por + ' marchas por acción.'); MS.add(id); }
    pMontaje();
  });
  document.getElementById('vb').onclick = () => { if (MBACK === 'tienda') { tab = 'tienda'; volver(null); } else volver({v: 'mibanda'}); };
  const mn = document.getElementById('mn');
  if (mn) mn.onclick = async () => {
    mn.disabled = true;
    const {error} = await sb.rpc('montar_marchas', {p_ids: [...MS]});
    if (error) { mn.disabled = false; return aviso(error.message); }
    MS = new Set(); CAT = null; await init();
  };
  if (!ens) aviso('Hoy es día de procesiones: solo puedes montar marchas en día de ensayo.');
}

// ======== Composición ========
let CF = {titulo: '', comp: '', estilo: '', ded: '', inv: 'cuidada'};
const ESTILOS = {fun: ['Lenta', 'Lenta con cornetas', 'Fúnebre'], ale: ['Con cornetas', 'De procesión']};
const INVS = [['boceto', 'Boceto', 'compo_boceto', 'Calidad 40-60'], ['cuidada', 'Cuidada', 'compo_cuidada', 'Calidad 60-80'], ['magistral', 'Magistral', 'compo_magistral', 'Calidad 80-100']];
function pComponer() {
  const v = document.getElementById('vista'), acc = P.compo_acciones || 4, inv = INVS.find(i => i[0] === CF.inv), coste = P[inv[2]];
  const nrep = (B.repertorio || []).length, ens = E.fase === 'ensayo';
  const ok = CF.titulo.trim().length >= 2 && CF.comp.trim().length >= 2 && CF.estilo && ens && B.acciones >= acc && B.dinero >= coste && nrep < MAXREP();
  const fun = ESTILOS.fun.includes(CF.estilo), corte = !CF.estilo ? '' : fun ? 'Corte fúnebre' : 'Corte alegre';
  const chip = e => `<button class="seg ${CF.estilo === e ? 'on' : ''}" data-e="${e}" style="min-height:44px">${e}</button>`;
  v.innerHTML = `<section><h2>Componer una marcha</h2><p class="nota" style="margin:0">Crea una marcha propia para tu banda. Solo en día de ensayo.</p>
  <label for="ct">Título</label><input id="ct" maxlength="50" value="${h(CF.titulo)}"><label for="cc">Compositor</label><input id="cc" maxlength="50" value="${h(CF.comp)}">
  <div class="lbl">Estilo</div><p class="nota" style="margin:0 0 6px">De corte fúnebre</p><div class="bt" style="flex-wrap:wrap">${ESTILOS.fun.map(chip).join('')}</div>
  <p class="nota" style="margin:10px 0 6px">De corte alegre</p><div class="bt" style="flex-wrap:wrap">${ESTILOS.ale.map(chip).join('')}</div>
  <label for="cd">Dedicatoria <span class="op">(opcional)</span></label><input id="cd" maxlength="60" value="${h(CF.ded)}"><p class="nota" style="text-align:right" id="cn">${CF.ded.length} de 60 caracteres</p></section>
  <section><h2>Inversión</h2><p class="nota" style="margin:0 0 6px">Más inversión, mejor marcha. Todas cuestan ${acc} acciones.</p>
  ${INVS.map(([k, n, p, q]) => `<button class="inv ${CF.inv === k ? 'on' : ''}" data-i="${k}"><span><b>${n}</b><small>${q}</small></span><b>${eur(P[p])}</b></button>`).join('')}</section>
  <section><div class="tag" style="font-weight:800;font-size:12px;text-transform:uppercase;color:var(--v2)">Vista previa</div><b style="font:700 22px 'Cormorant Garamond',serif">«${h(CF.titulo.trim() || 'Título de la marcha')}»</b>
  <p class="nota" style="margin:2px 0">${h(CF.comp.trim() || 'Compositor')} · ${CF.estilo ? 'Marcha ' + CF.estilo.toLowerCase() : 'Elige un estilo'}${CF.ded.trim() ? '<br>' + h(CF.ded.trim()) : ''}</p>
  ${corte ? `<span class="pill p2">${corte}</span> ` : ''}<span class="pill" style="background:var(--oro2)">${inv[3].replace('Calidad', 'Calidad esperada')}</span></section>
  <section><p class="nota" style="margin:0"><b>Efecto en el juego:</b> las marchas lentas cuentan como fúnebres para tu repertorio y las de cornetas o de procesión como alegres. Las propias dan un pequeño extra de satisfacción cuando salen en la crónica, más cuanto mayor sea su calidad. Otras bandas no pueden montarlas. Al estrenarla sale una noticia para todos.</p></section>
  <button class="of2" id="vb">${MBACK === 'tienda' ? 'Volver a la Tienda' : 'Volver a Mi banda'}</button>
  <div class="barra-fija"><button class="of" id="cg" ${ok ? '' : 'disabled'}>Componer (${acc} acciones · ${eur(coste)})</button></div>`;
  const leer = () => { CF.titulo = document.getElementById('ct').value; CF.comp = document.getElementById('cc').value; CF.ded = document.getElementById('cd').value; };
  ['ct', 'cc', 'cd'].forEach(i => document.getElementById(i).onchange = () => { leer(); pComponer(); });
  document.getElementById('cd').oninput = () => { document.getElementById('cn').textContent = document.getElementById('cd').value.length + ' de 60 caracteres'; };
  v.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { leer(); CF.estilo = b.dataset.e; pComponer(); });
  v.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { leer(); CF.inv = b.dataset.i; pComponer(); });
  document.getElementById('vb').onclick = () => { if (MBACK === 'tienda') { tab = 'tienda'; volver(null); } else volver({v: 'mibanda'}); };
  document.getElementById('cg').onclick = async () => {
    leer(); const g = document.getElementById('cg'); g.disabled = true;
    const {data, error} = await sb.rpc('componer_marcha', {p_titulo: CF.titulo, p_compositor: CF.comp, p_estilo: CF.estilo, p_dedicatoria: CF.ded, p_inversion: CF.inv});
    if (error) { g.disabled = false; return aviso(error.message); }
    const t = CF.titulo.trim(); CF = {titulo: '', comp: '', estilo: '', ded: '', inv: 'cuidada'}; CAT = null;
    ov(`<h2>¡Marcha compuesta!</h2><p>«${h(t)}» ya está en tu repertorio con una calidad de ${data.calidad} sobre 100. Todos verán la noticia del estreno.</p><button class="b2" id="ok">Continuar</button>`);
    document.getElementById('ok').onclick = () => { document.getElementById('ov').remove(); SUB = {v: 'montaje'}; MT = 'pro'; init(); };
  };
}

init();
</script>
</body>
</html>
