<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1238">
<title>Bandas Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--v:#2a1238;--v2:#4a2466;--oro:#e8b84a;--oro2:#f4d98c;--tinta:#1e1226;--fondo:#f4f1f6;--gris:#6a5f73;--lin:#e4dcea}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.45 Manrope,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,.f{font-family:"Cormorant Garamond",Georgia,serif;margin:0;font-weight:700}
h2{font-size:22px;margin-bottom:10px}
main{max-width:520px;margin:0 auto;padding:0 16px}
section{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 1px 0 var(--lin)}
label,.lbl{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.op{font-weight:600;color:var(--gris)}
input{display:block;width:100%;height:48px;padding:0 14px;font:inherit;border:1px solid #d9d1df;border-radius:12px;background:#fff}
input:focus,button:focus-visible{outline:3px solid var(--oro);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;min-height:44px;padding:0 16px;background:var(--v);color:#fff;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
button.link{background:none;color:var(--v2);text-decoration:underline;display:block;margin:6px auto 0}
.top{background:linear-gradient(160deg,#2a1238,#4a2466);color:#fff;padding:calc(24px + env(safe-area-inset-top)) 18px 20px;border-bottom:3px solid var(--oro);display:flex;align-items:center;gap:14px}
.top h1{font-size:25px;line-height:1.1;color:var(--oro2)}.top small{opacity:.8}
.chip{margin-left:auto;text-align:right;display:flex;flex-direction:column;font-weight:800;flex:none}.chip small{font-weight:400}
.auth{padding-top:48px}.auth h1{font-size:44px;color:var(--v)}.lema{color:var(--gris);margin:4px 0 8px}
.auth button:not(.link),.fund{width:100%;margin-top:18px;height:52px}
.aviso{background:#fbe9e7;color:#8a1c10;border-radius:10px;padding:10px 12px;margin-top:12px}
.aviso.fijo{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;z-index:5}
.nota{color:var(--gris);font-size:13px;margin:8px 0 0}
.tipos{display:grid;gap:8px}
.seg{background:#efe6f7;color:var(--v);text-align:left;padding:0 14px}.seg.on{background:var(--v);color:#fff}
.prev{border:2px dashed var(--oro);border-radius:14px;padding:14px;font:700 22px/1.2 "Cormorant Garamond",Georgia,serif;color:var(--v);background:#faf6ea;min-height:64px;display:flex;align-items:center}
.prev .ph{color:#8d8296}
.escs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.eb{background:#faf8fb;padding:6px;min-height:0;border-radius:12px;outline:1px solid var(--lin);display:flex;justify-content:center}
.eb.on{background:#efe6f7;outline:3px solid var(--oro)}.eb img{width:100%;height:auto;max-width:64px}
.fila{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #efe9f3}.fila:first-of-type{border-top:0}
.tile{width:40px;height:40px;border-radius:12px;background:#efe6f7;color:var(--v2);display:flex;align-items:center;justify-content:center;flex:none}
.fila b{flex:1}.fila input{width:84px;text-align:center}
.num{font:700 26px "Cormorant Garamond",serif}
.res{display:flex;gap:8px;text-align:left}.res div{flex:1}.res small{display:block;color:var(--gris);font-size:12px}
.bt{display:flex;gap:8px}.bt button{padding:0 14px}
.barra{height:16px;background:var(--oro);border-radius:8px;overflow:hidden}.barra i{display:block;height:100%;background:var(--v2)}
.fila2{display:flex;justify-content:space-between;margin-top:8px;font-weight:700;font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:#fff;border-top:1px solid var(--lin);padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;color:var(--gris);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;min-height:48px;padding:0}
.nav button.on{background:#efe6f7;color:var(--v)}
.rank{list-style:none;margin:0;padding:0}.rank li{display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid #efe9f3}
.rank li:first-child{border-top:0}.rank li.yo{background:#f6efd9;border-radius:12px}
.rank .pos{font:700 22px "Cormorant Garamond",serif;width:26px;text-align:center;color:var(--v2)}
.rank .nm{flex:1;min-width:0}.rank .nm b{display:block;line-height:1.2}.rank small{color:var(--gris)}
.rank .r{text-align:right;flex:none}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.jh{font-size:24px;margin:22px 4px 0;color:var(--v)}
.hc{padding:14px 16px}.hh{display:flex;justify-content:space-between;align-items:center;gap:8px}.hh h2{margin:0}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:#e4dcea;color:var(--v);flex:none}.p2{background:#efe6f7;color:var(--v2)}
.lbl2{color:var(--gris);font-size:13px;margin-top:10px}.ba{display:flex;align-items:center;gap:8px}.ba b{flex:1;line-height:1.2}
.cm{display:flex;justify-content:space-between;font-size:13px;margin-top:12px}.cm span:last-child{color:var(--gris)}
.bw{position:relative;margin-top:4px}.barra2{height:8px;border-radius:4px;background:#efe9f3;overflow:hidden}.barra2 i{display:block;height:100%}
.bw u{position:absolute;top:-3px;width:2px;height:14px;background:var(--tinta)}
.est{margin-top:12px;padding:10px 12px;border-radius:10px;background:#efe9f3;color:var(--gris);font-size:14px}
.est.l{background:#f6efd9;color:var(--tinta);font-weight:700}
.dots{display:flex;gap:6px;margin:8px 0}.dots i{width:16px;height:16px;border-radius:50%;background:var(--oro);border:2px solid var(--v2)}.dots i.off{background:transparent;border-color:#cfc5d6}
.xp{height:10px;border-radius:5px;background:#efe9f3;overflow:hidden;margin-top:6px}.xp i{display:block;height:100%;background:var(--oro)}
.ov{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#2a1238,#4a2466);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;overflow:auto}
.ov h2{color:var(--oro2);font-size:34px;margin:0}.ov p{max-width:420px;margin:0}
.beat{width:160px;height:160px;border-radius:50%;border:6px solid var(--oro);transition:background .08s,transform .08s}
.beat.on{background:var(--oro);transform:scale(1.08)}
.ov .b2{background:var(--oro);color:var(--v);width:100%;max-width:380px;height:56px;font-size:18px}
.ov .b3{background:rgba(255,255,255,.14);color:#fff;width:100%;max-width:420px;height:auto;min-height:56px;padding:12px 14px;text-align:left}
.of{width:100%;margin-top:12px;height:48px;background:var(--oro);color:var(--v)}
.of2{width:100%;margin-top:8px;background:#efe6f7;color:var(--v)}
.ov .avo{background:#f6efd9;color:var(--tinta);border:2px solid var(--oro);border-radius:14px;padding:14px;max-width:420px;text-align:left}
.ov .opt{display:flex;align-items:center;gap:12px;cursor:pointer;margin:0;font-size:16px}
.ov .opt input{width:24px;height:24px;padding:0;margin:0;flex:none;accent-color:var(--oro)}
.ov .opt span:first-of-type{flex:1}.ov .opt .pill{flex:none;background:var(--oro2);color:var(--v)}
.sws{display:flex;flex-wrap:wrap;gap:10px}.sw{width:44px;height:44px;border-radius:50%;padding:0;min-height:0;border:3px solid #fff;box-shadow:0 0 0 1px #cfc4d8}.sw.on{box-shadow:0 0 0 3px var(--v)}
.mods{display:flex;gap:8px}.md{flex:1;background:#fff;color:var(--v);border:2px solid var(--lin);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;height:auto}.md.on{border-color:var(--v);background:#efe6f7}
.uni{display:block;margin:0 auto}
.bt .seg{flex:1;text-align:center}
.tabs3{display:flex;gap:6px;margin-top:14px}.tabs3 button{flex:1;background:#fff;color:var(--gris);font-size:13px}.tabs3 button.on{background:var(--v);color:var(--oro2)}
.barra-fija{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));padding-top:8px}
.mini{min-width:44px;background:var(--oro2);color:var(--v);font-size:13px;padding:0 12px}.mini.sel{background:var(--v);color:var(--oro2)}.mini.off{background:var(--lin);color:var(--gris)}
.hq{background:none;color:inherit;display:flex;align-items:center;gap:14px;padding:0;text-align:left;min-height:0;flex:1;min-width:0}.hq div{min-width:0}
.rank li[data-id]{cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app'), EM = '@bandasfantasy.app';
let P = {}, B = null, tab = 'inicio', F = {tipo: 'Banda de Música', nombre: '', proc: '', esc: 1};
const TIPOS = ['Banda de Música', 'Asociación Musical', 'Sociedad Filarmónica'];
const ic = d => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const SEC = {
  bateria: ['Batería', 80, '<ellipse cx="12" cy="8" rx="8" ry="3"/><path d="M4 8v8c0 1.7 3.6 3 8 3s8-1.3 8-3V8M8 11l-2 6M16 11l2 6"/>'],
  cornetas: ['Cornetas', 100, '<path d="M3 10v4l9 3V7zM12 7l8-3v16l-8-3M6 14l1 5h3"/>'],
  percusion: ['Percusión', 30, '<circle cx="8" cy="13" r="5"/><circle cx="17" cy="9" r="4"/>'],
  madera: ['Viento madera', 0, '<path d="M4 20L20 4"/><circle cx="9" cy="15" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="15" cy="9" r=".8"/>'],
  metal: ['Viento metal', 70, '<path d="M3 11h9M3 13h9M12 8l8-3v14l-8-3z"/>']};
const NAV = [['inicio', 'Inicio', '<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>'], ['contratos', 'Contratos', '<path d="M7 3h8l4 4v14H7zM15 3v4h4M10 12h6M10 16h6"/>'], ['tienda', 'Tienda', '<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/>'], ['ranking', 'Ranking', '<path d="M8 4h8v5a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 13v4M8 20h8"/>']];
const h = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => Number(n).toLocaleString('es-ES') + ' €';
const tot = b => Object.keys(SEC).reduce((a, k) => a + b[k], 0);
const tope = k => P['max_' + k] || Infinity;
const DEF = {bateria: 6, cornetas: 4, percusion: 4, madera: 8, metal: 8};
const escudo = (n, s) => `<img src="escudos/escudo-${String(n || 1).padStart(2, '0')}.png" width="${s}" height="${s}" alt="">`;
const traducir = m => ({'Invalid login credentials': 'Usuario o contraseña incorrectos.', 'User already registered': 'Ese usuario ya existe.'}[m] || m);
const aviso = t => { const e = document.getElementById('aviso'); if (e) { e.textContent = t; e.hidden = !t; } };

function vistaAuth(reg) {
  app.innerHTML = `<main class="auth"><h1 class="f">Bandas Fantasy</h1>
  <p class="lema">Crea tu banda, gana contratos y compite por la Semana Santa.</p>
  <label for="u">Usuario</label><input id="u" autocomplete="username" autocapitalize="none">
  <label for="p">Contraseña</label><input id="p" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}">
  <p id="aviso" class="aviso" hidden></p>
  <button id="go">${reg ? 'Crear cuenta' : 'Entrar'}</button>
  <button class="link" id="alt">${reg ? 'Ya tengo cuenta' : 'Quiero registrarme'}</button></main>`;
  document.getElementById('go').onclick = () => entrar(reg);
  document.getElementById('alt').onclick = () => vistaAuth(!reg);
}

async function entrar(reg) {
  const u = document.getElementById('u').value.trim().toLowerCase(), p = document.getElementById('p').value;
  if (!/^[a-z0-9_]{3,20}$/.test(u)) return aviso('Usuario: de 3 a 20 caracteres, solo letras sin tilde, números o guion bajo.');
  if (p.length < 6) return aviso('La contraseña necesita al menos 6 caracteres.');
  const cred = {email: u + EM, password: p};
  const {data, error} = reg ? await sb.auth.signUp(cred) : await sb.auth.signInWithPassword(cred);
  if (error) return aviso(traducir(error.message));
  if (reg && !data.session) return aviso('Cuenta creada, pero Supabase pide confirmar el correo.');
  init();
}

async function init() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return vistaAuth(false);
  const {data: ps, error: e1} = await sb.from('parametros').select('*');
  if (e1) { app.innerHTML = '<main><section><h2>No se pudo cargar el juego</h2><p class="nota">' + h(e1.message) + '</p></section></main>'; return; }
  P = {}; ps.forEach(x => P[x.clave] = Number(x.valor));
  const {data: est} = await sb.rpc('sincronizar'); E = est || E;
  await sb.rpc('refrescar_dia');
  const {data: b} = await sb.from('bandas').select('*, repertorio(marcha_id, marchas(estilo,propia_de))').eq('id', session.user.id).maybeSingle();
  B = b;
  b ? vistaApp() : vistaCrear();
}

const nombreFinal = () => { const n = F.nombre.trim(), p = F.proc.trim(); return n ? `${F.tipo} «${n}»${p ? ' de ' + p : ''}` : ''; };

function vistaCrear() {
  const min = P.min_musicos, pr = P.precio_musico + P.precio_uniforme;
  app.innerHTML = `<header class="top"><div><h1>Funda tu banda</h1><small>Solo se hace una vez</small></div></header><main>
  <section><h2>Nombre</h2>
  <div class="lbl" style="margin-top:0">Tipo de banda</div>
  <div class="tipos">${TIPOS.map(t => `<button class="seg ${t === F.tipo ? 'on' : ''}" data-tipo="${t}" aria-pressed="${t === F.tipo}">${t}</button>`).join('')}</div>
  <label for="nb">Nombre de la banda</label><input id="nb" maxlength="40" placeholder="Nuestra Señora de los Dolores" value="${h(F.nombre)}">
  <label for="pr">Procedencia <span class="op">(opcional)</span></label><input id="pr" maxlength="30" placeholder="Sevilla, Utrera, Olivares…" value="${h(F.proc)}">
  <div class="lbl">Así se llamará tu banda</div><div id="prev" class="prev"></div>
  <p class="nota">Solo da realismo al nombre: no influye en el juego.</p></section>
  <section><h2>Escudo</h2><div class="escs">${Array.from({length: P.num_escudos}, (_, i) => `<button class="eb ${F.esc === i + 1 ? 'on' : ''}" data-e="${i + 1}" aria-label="Escudo ${i + 1}" aria-pressed="${F.esc === i + 1}">${escudo(i + 1, 64)}</button>`).join('')}</div></section>
  <section><h2>Plantilla inicial</h2><p class="nota" style="margin:0 0 4px">Mínimo ${min} músicos. Cada uno cuesta ${eur(pr)} con su uniforme. Cornetas: máximo ${tope('cornetas')}. Percusión: máximo ${tope('percusion')} (dos cajas, bombo y platillo).</p>
  ${Object.entries(SEC).map(([k, [n, , d]]) => `<div class="fila"><div class="tile">${ic(d)}</div><b><label for="s_${k}" style="margin:0;font-size:16px">${n}${tope(k) < Infinity ? ` <small style="color:var(--gris);font-weight:600">(máx. ${tope(k)})</small>` : ''}</label></b><input id="s_${k}" type="number" min="0" ${tope(k) < Infinity ? `max="${tope(k)}"` : ''} value="${DEF[k]}" inputmode="numeric" data-s="${k}"></div>`).join('')}</section>
  <section style="border:2px solid var(--oro)"><div class="res" id="res"></div></section>
  <p id="aviso" class="aviso" hidden></p><button id="go" class="fund">Fundar banda</button></main>`;
  const ins = [...app.querySelectorAll('[data-s]')], num = i => Math.min(tope(i.dataset.s), Math.max(0, parseInt(i.value) || 0));
  const calc = () => {
    const n = ins.reduce((a, i) => a + num(i), 0), c = n * pr;
    document.getElementById('prev').innerHTML = h(nombreFinal()) || `<span class="ph">${h(F.tipo)} «Tu nombre»</span>`;
    document.getElementById('res').innerHTML = `<div><span class="num">${n}</span><small>músicos</small></div><div><span class="num">${eur(c)}</span><small>coste</small></div><div><span class="num">${eur(P.dinero_inicial - c)}</span><small>te quedan</small></div>`;
    document.getElementById('go').disabled = !(F.nombre.trim().length >= 2 && n >= min && c <= P.dinero_inicial);
  };
  const marcar = (sel, b) => app.querySelectorAll(sel).forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  app.querySelectorAll('[data-tipo]').forEach(b => b.onclick = () => { F.tipo = b.dataset.tipo; marcar('[data-tipo]', b); calc(); });
  app.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { F.esc = +b.dataset.e; marcar('[data-e]', b); });
  document.getElementById('nb').oninput = e => { F.nombre = e.target.value; calc(); };
  document.getElementById('pr').oninput = e => { F.proc = e.target.value; calc(); };
  ins.forEach(i => i.oninput = calc); calc();
  document.getElementById('go').onclick = async () => {
    const a = {p_tipo: F.tipo, p_nombre: F.nombre, p_procedencia: F.proc, p_escudo: F.esc};
    ins.forEach(i => a['p_' + i.dataset.s] = num(i));
    const {error} = await sb.rpc('crear_banda', a);
    if (error) return aviso(error.message.includes('duplicate') ? 'Ese nombre de banda ya está cogido.' : error.message);
    init();
  };
}

function perfil() {
  const r = B.repertorio || [], f = r.filter(x => x.marchas.estilo === 'Fúnebre').length, t = tot(B) || 1;
  const pot = Math.round(Object.entries(SEC).reduce((a, [k, [, w]]) => a + B[k] * w, 0) / t);
  return {nm: r.length, pf: r.length ? Math.round(f * 100 / r.length) : 0, pot};
}

function vistaApp() {
  app.innerHTML = `<header class="top"><button class="hq" id="hq" aria-label="Mi banda">${escudo(B.escudo, 52)}<div><h1>${h(B.nombre)}</h1><small>${h(B.usuario)} · toca para editar tu banda</small></div></button>
  <div class="chip"><span>${eur(B.dinero)}</span><small>Nivel ${B.nivel}</small></div></header>
  <main id="vista"></main><div id="aviso" class="aviso fijo" hidden></div>
  <nav class="nav">${NAV.map(([k, n, d]) => `<button class="${k === tab && !SUB ? 'on' : ''}" data-t="${k}">${ic(d)}${n}</button>`).join('')}<button id="salir">${ic('<path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/>')}Salir</button></nav>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; SUB = null; vistaApp(); });
  document.getElementById('hq').onclick = () => { SUB = {v: 'mibanda'}; vistaApp(); };
  window.scrollTo(0, 0);
  document.getElementById('salir').onclick = async () => { await sb.auth.signOut(); B = null; vistaAuth(false); };
  (SUB ? {mibanda: pMiBanda, montaje: pMontaje, pp: pPerfilPublico}[SUB.v] : {inicio: pInicio, contratos: pContratos, tienda: pTienda, ranking: pRanking}[tab])();
}

async function pInicio() {
  const p = perfil(), a = B.acciones, base = xpDe(B.nivel), sig = xpDe(B.nivel + 1), sem = E.fase === 'semana';
  const prog = B.nivel >= 20 ? 100 : Math.round(100 * (B.experiencia - base) / (sig - base));
  document.getElementById('vista').innerHTML = `
  <section>${sem ? `<h2>Semana Santa</h2><p style="margin:0 0 8px">Hoy es día de procesiones. Toca cada jornada cuando quieras. A las 00:00, las que no hayas tocado se resolverán solas y cobrarás solo la mitad de dinero y de experiencia.</p><div id="sj"></div>`
  : `<h2>Día de ensayo</h2><div class="fila2" style="margin-top:0"><span>Acciones de hoy</span><span>${a} de ${P.acciones_dia}</span></div>
  <div class="dots" aria-hidden="true">${Array.from({length: P.acciones_dia}, (_, i) => `<i class="${i < a ? '' : 'off'}"></i>`).join('')}</div>
  <button id="ens" class="fund" style="margin-top:10px" ${a < 1 ? 'disabled' : ''}>Ensayar (1 acción)</button>`}
  <div class="fila2"><span>Nivel ${B.nivel}</span><span>${B.experiencia} xp</span></div><div class="xp"><i style="width:${prog}%"></i></div>
  <p class="nota">${B.nivel >= 20 ? 'Nivel máximo.' : 'Siguiente nivel: ' + sig + ' xp.'} Cierre del día a las 00:00.</p></section>
  <section id="nt"><h2>Noticias</h2></section>
  <section id="ct"><h2>Tus contratos</h2></section>

const JORN = ['Vísperas', 'Domingo de Ramos', 'Lunes Santo', 'Martes Santo', 'Miércoles Santo', 'Jueves Santo', 'Madrugá', 'Viernes Santo', 'Sábado Santo', 'Domingo de Resurrección'];
let H = null, fil = 'todas';
const compat = (x, p) => Math.round(0.7 * (100 - Math.abs(p.pf - x.pct_funebre)) + 0.3 * (100 - Math.abs(p.pot - (100 - x.pct_funebre))));

let E = {fase: 'ensayo'}, C = {}, O = {}, MYJ = new Set(), OFJ = new Set();
const horasDe = x => { if (!x.hora_salida || !x.hora_recogida) return P.horas_ref; const m = t => +t.slice(0, 2) * 60 + +t.slice(3, 5); let d = (m(x.hora_recogida) - m(x.hora_salida)) / 60; return d <= 0 ? d + 24 : d; };
const pagoDe = (x, nivel) => Math.round(({'Fácil': P.pago_facil, 'Media': P.pago_media, 'Alta': P.pago_alta}[x.categoria] || P.pago_extrema) * horasDe(x) / P.horas_ref * (1 + P.nivel_pct / 100 * (Math.max(nivel, 1) - 1)) / 5) * 5;
const maxC = n => n < 3 ? 3 : n < 5 ? 4 : n < 7 ? 5 : n < 9 ? 6 : n < 12 ? 7 : n < 15 ? 8 : n < 18 ? 9 : 10;

function tarjeta(x, e, p) {
  const c = compat(x, p), ct = C[x.id], of = O[x.id];
  const bn = ct ? ct.bandas.nombre : (x.bandas_ficticias ? x.bandas_ficticias.nombre : 'Sin banda');
  let cuerpo;
  if (e === 's') cuerpo = '<div class="est">Sin banda de música. Va en silencio: solo un cabildo extraordinario podría contratar una.</div>';
  else {

    let acc;

    else if (e === 'o') acc = `<div class="est l">Oferta presentada: se resuelve a las 00:00.</div><button class="of2" data-r="${of.id}">Retirar oferta</button>`;
    else if (e === 'l') acc = E.fase !== 'ensayo' ? '<div class="est">Las ofertas se presentan en el día de ensayo.</div>' : MYJ.has(x.jornada) ? '<div class="est">Ya tienes un contrato ese día.</div>' : OFJ.has(x.jornada) ? '<div class="est">Ya tienes otra oferta ese día.</div>' : `<button class="of" data-h="${x.id}">Presentar oferta</button>`;
    else acc = `<div class="est">Te falta ${mot}. Nivel mínimo ${x.nivel_min}.</div>`;
    cuerpo = `<div class="lbl2">Banda actual</div><div class="ba"><b>${h(bn)}</b><span class="pill" ${ct ? 'style="background:var(--oro2)"' : ''}>${ct ? 'Jugador' : 'Ficticia'}</span></div>
    <div class="cm"><span>Pago por jornada <b>${eur(pagoDe(x, B.nivel))}</b></span><span>${Math.round(horasDe(x) * 10) / 10} h en la calle</span></div>
    <div class="cm"><span>Compatibilidad <b>${c}</b></span><span>mínima ${x.compat_min}</span></div>
    <div class="bw"><div class="barra2"><i style="width:${c}%;background:${c >= x.compat_min ? 'var(--v2)' : '#8d8296'}"></i></div><u style="left:${x.compat_min}%"></u></div>${acc}`;
  }
  return `<section class="hc"><div class="hh"><h2>${h(x.nombre)}</h2><span class="pill p2">${h(x.categoria || '')}</span></div>${cuerpo}</section>`;
}

function modalOferta(x) {
  const k = {'Fácil': 'facil', 'Media': 'media', 'Alta': 'alta'}[x.categoria] || 'extrema';
  const ps = P['saya_' + k], pr = P['regalo_' + k];
  const OP = [['saya', 'Saya para la Virgen', 'Donativo de ' + eur(ps), P.peso_saya, P.pol_saya, ps],
    ['rebaja', 'Rebajar el contrato', P.rebaja_pct + ' % menos de pago durante todo el contrato', P.peso_rebaja, P.pol_rebaja, 0],
    ['regalo', 'Regalo a la hermandad', eur(pr) + ' en enseres', P.peso_regalo, P.pol_regalo, pr]];
  const e = ov(`<h2>${h(x.nombre)}</h2>
  <div class="avo"><b class="f" style="font-size:24px">Solo pagas si ganas</b><br>Si la hermandad elige a otra banda, no se te cobra nada. El dinero queda comprometido, no gastado, hasta el cierre de las 00:00.</div>
  <div id="cl" style="width:100%;max-width:420px;background:rgba(255,255,255,.14);border-radius:14px;padding:14px;text-align:left"></div>
  ${OP.map(([c, t, d, pt]) => `<label class="b3 opt"><input type="checkbox" data-o="${c}"><span><b>${t}</b><br><small>${d}</small></span><span class="pill">+${pt} %</span></label>`).join('')}
  <p id="rs"></p><button class="b2" id="go2">Presentar oferta</button><button class="b3" id="no" style="text-align:center">Cancelar</button>`);
  const f = c => e.querySelector(`[data-o="${c}"]`).checked;
  const calc = () => {
    const s = OP.filter(o => f(o[0])), co = s.reduce((a, o) => a + o[5], 0), ri = s.reduce((a, o) => a + o[4], 0);
    const w = P.peso_limpia + s.reduce((a, o) => a + o[3], 0), b0 = P.prob_sin_rivales / 100;
    const pr1 = Math.round(100 * (b0 + (1 - b0) * (w - P.peso_limpia) / w) * (1 - P.dificultad_peso / 100 * (x.dificultad || 50) / 100));
    document.getElementById('cl').innerHTML = s.length ? '<b>Campaña con ofertas</b><br><small>Cada extra aumenta tu peso frente a otras bandas. El % indica cuánto suma frente a una campaña limpia.</small>'
      : '<b>Campaña limpia</b><br><small>No gastas nada y no hay riesgo de polémica, pero tienes menos peso si otra banda también se presenta.</small>';
    document.getElementById('rs').innerHTML = `Si no hay rivales, tu probabilidad es del ${pr1} %. Si se presentan más bandas, la hermandad elige una de ellas según el peso de cada oferta.<br>Riesgo de polémica: ${ri} %. Dinero comprometido: ${eur(co)} de ${eur(B.dinero)}.`;
    document.getElementById('go2').disabled = co > B.dinero;
  };
  e.querySelectorAll('[data-o]').forEach(i => i.onchange = calc); calc();
  document.getElementById('no').onclick = () => e.remove();
  document.getElementById('go2').onclick = async () => {
    const {error} = await sb.rpc('presentar_oferta', {p_h: x.id, p_saya: f('saya'), p_rebaja: f('rebaja'), p_regalo: f('regalo')});
    e.remove();
    if (error) return aviso(error.message);
    pContratos();
  };
}

async function pContratos() {
  const v = document.getElementById('vista');
  if (!H) {
    v.innerHTML = '<section><h2>Buscar contratos</h2><p class="nota">Cargando…</p></section>';
    const {data, error} = await sb.from('hermandades').select('id,nombre,jornada,categoria,nivel_min,compat_min,silencio,pct_funebre,dificultad,hora_salida,hora_recogida,bandas_ficticias(nombre)').order('id');

  }
  const [rc, ro] = await Promise.all([sb.from('contratos').select('hermandad_id,banda_id,anios,bandas(nombre)'), sb.from('ofertas').select('id,hermandad_id,prioridad')]);

  const ofs = Object.values(O).sort((a, b) => a.prioridad - b.prioridad), libres = Math.max(0, maxC(B.nivel) - mios.length);
  const p = perfil();
  const est = x => x.silencio ? 's' : C[x.id] && C[x.id].banda_id === B.id ? 'm' : B.nivel < x.nivel_min || compat(x, p) < x.compat_min ? 'b' : O[x.id] ? 'o' : 'l';

  v.innerHTML = `<section><h2>Buscar contratos</h2><div class="res"><div><span class="num">${mios.length} de ${maxC(B.nivel)}</span><small>contratos</small></div><div><span class="num">${Object.keys(O).length} de ${P.max_ofertas}</span><small>ofertas</small></div></div>

  ${ofs.length ? `<section><h2>Tus ofertas por orden de preferencia</h2>
  <p class="nota">Se resuelven de la primera a la última. ${libres < ofs.length ? `<b>Solo te caben ${libres} contrato${libres === 1 ? '' : 's'} más: si ganas más, se descartan las últimas de tu lista.</b>` : `Te caben ${libres} contrato${libres === 1 ? '' : 's'} más.`}</p>
  ${ofs.map((o, i) => `<div class="fila"><span class="pill ${i < libres ? 'p2' : ''}" style="min-width:26px;text-align:center">${i + 1}</span><div style="flex:1"><b style="display:block">${h(H.find(x => x.id === o.hermandad_id).nombre)}</b><small style="color:var(--gris)">${H.find(x => x.id === o.hermandad_id).jornada}${i >= libres ? ' · no cabe' : ''}</small></div>
  <button data-u="${i}" aria-label="Subir" ${i === 0 ? 'disabled' : ''} style="width:44px;height:44px;border:0;border-radius:12px;background:#efe6f7;color:#2a1238;font:700 18px inherit;margin-left:6px">▲</button>
  <button data-d="${i}" aria-label="Bajar" ${i === ofs.length - 1 ? 'disabled' : ''} style="width:44px;height:44px;border:0;border-radius:12px;background:#efe6f7;color:#2a1238;font:700 18px inherit;margin-left:6px">▼</button></div>`).join('')}</section>` : ''}
  <div class="chips">${[['todas', 'Todas'], ['libres', 'A tu alcance']].map(([k, n]) => `<button class="seg ${fil === k ? 'on' : ''}" data-f="${k}" aria-pressed="${fil === k}">${n}</button>`).join('')}</div>

const DEC = {sale: 'Ha salido y no ha llovido', sale_moja: 'Ha salido y se ha mojado', se_recoge: 'Se ha recogido antes de tiempo',
  refugia: 'Se ha refugiado en la Catedral y vuelve mañana temprano', no_sale: 'No ha salido'};
const FASES = ['Salida', 'Recorrido', 'Carrera oficial', 'Recogida'];
const filaEf = e => e > 0 ? `+${e}` : `${e}`;

async function semanaDatos() {
  const [rc, rt, ra] = await Promise.all([
    sb.from('contratos').select('hermandad_id,hermandades(nombre,jornada,hora_salida,hora_recogida)').eq('banda_id', B.id),
    sb.rpc('tiempo_semana'), sb.from('actuaciones').select('*').eq('banda_id', B.id).eq('temporada', E.temporada)]);
  const T = {}; (rt.data || []).forEach(x => T[x.jornada] = x.prevision);
  const A = {}; (ra.data || []).forEach(x => A[x.hermandad_id] = x);
  const cs = (rc.data || []).sort((x, y) => JORN.indexOf(x.hermandades.jornada) - JORN.indexOf(y.hermandades.jornada));
  return {cs, T, A};
}
const pendiente = S => S.cs.find(c => !S.A[c.hermandad_id]);
const sigDe = S => { const c = pendiente(S); return c ? {c, prev: S.T[c.hermandades.jornada]} : null; };
const datosActuacion = (a, hm) => ({...a.detalle, decision: a.decision, llueve: a.llueve, prevision: a.prevision, refuerzos: a.refuerzos, ingresos: a.ingresos,
  coste: a.coste, xp: a.xp, prestigio: a.prestigio, satisfaccion: a.satisfaccion, retraso: a.retraso, auto: a.auto, hermandad: hm.nombre, jornada: hm.jornada});

async function semanaLista() {
  const el = document.getElementById('sj'); if (!el) return;
  el.innerHTML = '<p class="nota">Cargando jornadas…</p>';
  const S = await semanaDatos(), sg = sigDe(S), hechas = S.cs.filter(c => S.A[c.hermandad_id]).length;
  if (!S.cs.length) { el.innerHTML = '<p class="nota" style="margin:0">No tienes contratos esta Semana Santa.</p>'; return; }
  el.innerHTML = S.cs.map(c => { const a = S.A[c.hermandad_id], hm = c.hermandades;
    return `<div class="fila"><div style="flex:1"><b style="display:block">${h(hm.nombre)}</b><small style="color:var(--gris)">${hm.jornada} · ${a ? 'cobrado ' + eur(a.ingresos) : 'lluvia prevista ' + (S.T[hm.jornada] ?? '?') + ' %'}</small></div>
    ${a ? `<button class="of2" data-j="${c.hermandad_id}" style="width:auto;padding:0 14px;margin:0">Ver crónica</button>` : '<span class="pill">Pendiente</span>'}</div>`; }).join('')
    + (sg ? `<button class="fund" id="emp" style="margin-top:12px">${hechas ? 'Continuar la Semana Santa' : 'Empezar la Semana Santa'}</button>`
      : `<button class="fund" id="res" style="margin-top:12px">Resumen de la Semana Santa</button>`);

  <div class="avo">${f.map(({c, a}) => `<div style="padding:8px 0;border-top:1px solid #e4d8b8"><b>${h(c.hermandades.nombre)}</b> <small>· ${c.hermandades.jornada}</small><br>

async function previaJornada(c, prev) {
  const {data: bb} = await sb.from('bandas').select('dinero').eq('id', B.id).single(); if (bb) B.dinero = bb.dinero;
  const hm = c.hermandades; let n = 0;
  const hs = t => t ? String(t).slice(0, 5) : '—';
  const e = ov(`<h2>${h(hm.nombre)}</h2><p>${hm.jornada}</p>
  <div class="avo"><b class="f" style="font-size:24px">Previsión de lluvia: ${prev} %</b><br>La hermandad decide si sale según el cielo. Si llueve, llueve para toda la ciudad.<br><small>Salida oficial ${hs(hm.hora_salida)} · Recogida oficial ${hs(hm.hora_recogida)}</small></div>
  <div class="avo"><b>Refuerzos de última hora</b><br><small>${P.refuerzo_precio} € por músico. Ayudan a que suene mejor.</small>
  <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px"><button class="b3" id="rm" style="width:56px;text-align:center;padding:0">−</button><b class="f" style="font-size:32px" id="rn">0</b><button class="b3" id="rp" style="width:56px;text-align:center;padding:0">+</button></div>
  <p id="rc" style="margin-top:8px;text-align:center"></p></div>
  <button class="b2" id="go3">¡Que suene la banda!</button><button class="b3" id="no" style="text-align:center">Volver</button>`);
  const pintar = () => { document.getElementById('rn').textContent = n; document.getElementById('rc').textContent = n * P.refuerzo_precio + ' € de ' + eur(B.dinero); };
  pintar();
  document.getElementById('rm').onclick = () => { n = Math.max(0, n - 1); pintar(); };
  document.getElementById('rp').onclick = () => { if (n < P.refuerzo_max && (n + 1) * P.refuerzo_precio <= B.dinero) n++; pintar(); };
  document.getElementById('no').onclick = () => { e.remove(); init(); };
  document.getElementById('go3').onclick = async () => {
    document.getElementById('go3').disabled = true;
    const {data, error} = await sb.rpc('jugar_jornada', {p_h: c.hermandad_id, p_ref: n});
    if (error) { e.remove(); return aviso(error.message); }
    const S = await semanaDatos();
    cronica(data, sigDe(S), S);
  };
}

function cronica(d, sig, S) {
  const pag = [];
  if (d.decision === 'no_sale') pag.push('nosale');
  else FASES.forEach(f => { if ((d.tramos || []).some(t => t.momento === f)) pag.push(f); });
  pag.push('fin');
  let i = 0;
  const hs = t => t || '—';
  const pintar = () => {
    const pg = pag[i], ultimo = i === pag.length - 1;
    let cuerpo;
    if (pg === 'nosale') cuerpo = `<div class="avo"><b class="f" style="font-size:24px">${d.llueve ? 'Hoy ha llovido en toda la ciudad' : 'No ha llovido, pero la hermandad no ha salido'}</b><br>La previsión era del ${d.prevision} % y la Junta ha decidido no arriesgar.</div>
      ${(d.otras || []).length ? `<div class="avo"><b>Qué han decidido las demás</b>${d.otras.slice(0, 8).map(o => `<div class="fila2"><span>${h(o.hermandad)}</span><span>${DEC[o.decision] || o.decision}</span></div>`).join('')}</div>` : ''}`;
    else if (pg === 'fin') cuerpo = `<div class="avo"><b class="f" style="font-size:24px">${DEC[d.decision]}</b>
      <div class="fila2"><span>Cobrado</span><span>${eur(d.ingresos)}</span></div>
      ${d.coste ? `<div class="fila2"><span>Refuerzos</span><span>−${eur(d.coste)}</span></div>` : ''}
      <div class="fila2"><span>Experiencia</span><span>+${d.xp} xp</span></div>
      <div class="fila2"><span>Prestigio</span><span>${d.prestigio > 0 ? '+' : ''}${d.prestigio}</span></div>
      ${d.decision !== 'no_sale' && !d.auto ? `<div class="fila2"><span>Satisfacción de la hermandad</span><span>${d.satisfaccion} %</span></div>
      <div class="fila2"><span>Recogida</span><span>${hs(d.hora_recogida)} (oficial ${hs(d.hora_recogida_oficial)})</span></div>` : ''}
      ${d.auto ? '<p class="nota" style="color:#4a3a5a">Esta jornada se resolvió sola porque no te conectaste: cobraste la mitad.</p>' : ''}</div>
      ${d.decision === 'refugia' ? '<div class="avo">La vuelta es mañana temprano desde la Catedral. No gasta acciones.</div>' : ''}`;
    else cuerpo = (d.tramos || []).filter(t => t.momento === pg).map(t => `<div class="avo"><small><b>${h(t.tramo)}</b></small><br>${h(t.texto)}<br><span class="pill" style="margin-top:6px;display:inline-block;background:${t.efecto > 0 ? '#e1f2e6' : t.efecto < 0 ? '#fbe9e7' : '#efe9f3'};color:${t.efecto > 0 ? '#1d6236' : t.efecto < 0 ? '#8a1c10' : '#4a2466'}">Satisfacción ${filaEf(t.efecto)}</span></div>`).join('');
    const tit = pg === 'fin' ? 'Jornada completada' : pg === 'nosale' ? 'No sale' : pg;
    const botones = !ultimo ? '<button class="b2" id="sig">Siguiente</button>'
      : (sig ? `<button class="b2" id="nx">Siguiente contrato (${h(sig.c.hermandades.nombre)} - ${sig.c.hermandades.jornada})</button>`
             : '<button class="b2" id="rs">Resumen de la Semana Santa</button>') + '<button class="b3" id="cl2" style="text-align:center">Cerrar</button>';
    ov(`<h2>${tit}</h2><p>${h(d.hermandad)} · ${d.jornada}</p>${cuerpo}${botones}`);
    const cerrar = () => { document.getElementById('ov').remove(); init(); };
    if (!ultimo) document.getElementById('sig').onclick = () => { i++; pintar(); };
    else {
      document.getElementById('cl2').onclick = cerrar;
      if (sig) document.getElementById('nx').onclick = () => previaJornada(sig.c, sig.prev);
      else document.getElementById('rs').onclick = async () => resumen(S || await semanaDatos());
    }
  };
  pintar();
}

let IMP = null;
const xpDe = n => 100 * (n - 1) ** 2;
const ov = html => { let e = document.getElementById('ov'); if (!e) { e = document.createElement('div'); e.id = 'ov'; e.className = 'ov'; document.body.appendChild(e); } e.innerHTML = html; return e; };
const fin = (titulo, msg) => { ov(`<h2>${titulo}</h2><p>${msg}</p><button class="b2" id="ok">Continuar</button>`); document.getElementById('ok').onclick = () => { document.getElementById('ov').remove(); init(); }; };

async function ensayar() {
  if (E.fase !== 'ensayo') return aviso('Hoy es día de Semana Santa.');
  if (B.acciones < 1) return aviso('No te quedan acciones hoy.');
  if (!IMP) { const {data} = await sb.from('imprevistos').select('*').order('id'); IMP = data || []; }
  IMP.length && Math.random() < 0.35 ? imprevisto(IMP[Math.floor(Math.random() * IMP.length)]) : pulso();
}

function pulso() {
  const N = 12, GAP = 800, beats = [], taps = []; let acabado = false;
  ov(`<h2>Pulso de la banda</h2><p>Toca al ritmo cuando el círculo se ilumine. Los dos primeros golpes son de calentamiento.</p><div class="beat" id="bt"></div><button class="b2" id="tap">Tocar</button><button class="b3" id="sk" style="text-align:center">Saltar (resultado bajo)</button>`);
  const bt = document.getElementById('bt'), t0 = performance.now() + 1200;
  document.getElementById('tap').onpointerdown = () => taps.push(performance.now());
  const enviar = async sc => {
    if (acabado) return; acabado = true;
    const {data, error} = await sb.rpc('ensayar_pulso', {p_puntuacion: sc});
    if (error) { document.getElementById('ov').remove(); return aviso(error.message); }
    fin('Ensayo terminado', `Puntuación del pulso: ${sc} de 100. Ganas ${data} xp.`);
  };
  document.getElementById('sk').onclick = () => enviar(30);
  for (let i = 0; i < N; i++) {
    beats.push(t0 + i * GAP);
    setTimeout(() => { bt.classList.add('on'); setTimeout(() => bt.classList.remove('on'), 150); }, t0 + i * GAP - performance.now());
  }
  setTimeout(() => {
    let s = 0;
    beats.slice(2).forEach(b => { const d = Math.min(999, ...taps.map(x => Math.abs(x - b))); s += Math.max(0, 1 - d / 350); });
    enviar(Math.round(100 * s / (N - 2)));
  }, t0 + (N - 1) * GAP + 600 - performance.now());
}

function imprevisto(ev) {
  const e = ov(`<h2>${h(ev.titulo)}</h2><p>${h(ev.texto)}</p>${ev.opciones.map((o, i) => `<button class="b3" data-o="${i}">${h(o.texto)}${o.coste ? ' (' + eur(o.coste) + ')' : ''}</button>`).join('')}`);
  e.querySelectorAll('[data-o]').forEach(b => b.onclick = async () => {
    const {data, error} = await sb.rpc('resolver_imprevisto', {p_id: ev.id, p_opcion: +b.dataset.o});
    if (error) { document.getElementById('ov').remove(); return aviso(error.message); }
    fin('Ensayo terminado', `Ganas ${data.xp} xp.` + (data.coste ? ` Gastas ${eur(data.coste)}.` : '') + (data.multa ? ' Ha saltado una multa.' : ''));
  });
}

// ======== Uniformes (imágenes recoloreables) ========
const UN = {}, GO = {}, GPOS = {1: [140, 42], 2: [140, 20], 3: [140, 20]};
const PAL = ['#14213d', '#1f3a8a', '#14532d', '#7a1020', '#5b2c83', '#e8e4d8', '#1b1b1f', '#5a3a1a', '#8a8a8a', '#e8c34a'];
const UDEF = {modelo: 2, chaqueta: '#7a1020', pantalon: '#1b1b1f', corbata: '#e8c34a', cinturon: '#5a3a1a', metal: 'oro', gorra: '#7a1020'};
const cargaImg = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('No se pudo cargar ' + src)); i.src = src; });
const pixeles = img => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const x = c.getContext('2d', {willReadFrequently: true}); x.drawImage(img, 0, 0); return x.getImageData(0, 0, c.width, c.height); };
const hexRgb = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
const pct = (arr, q) => { if (!arr.length) return 1; arr.sort((a, b) => a - b); return arr[Math.floor(arr.length * q)] || 1; };
function recursoZonas(src, zsrc) {
  return (async () => {
    const [a, z] = await Promise.all([cargaImg(src), cargaImg(zsrc)]);
    const A = pixeles(a), Z = pixeles(z), n = A.width * A.height, lum = new Float32Array(n), por = {1: [], 2: [], 3: [], 4: [], 5: [], 6: []};
    for (let i = 0; i < n; i++) { lum[i] = .3 * A.data[i * 4] + .59 * A.data[i * 4 + 1] + .11 * A.data[i * 4 + 2]; const zn = Z.data[i * 4]; if (por[zn]) por[zn].push(lum[i]); }
    const ref = {}; for (const k in por) ref[k] = pct(por[k], k == 5 ? .7 : .6);
    return {A, Z, lum, ref};
  })();
}
function pinta(R, u, tintes) {
  const {A, Z, lum, ref} = R, out = new ImageData(new Uint8ClampedArray(A.data), A.width, A.height), n = A.width * A.height;
  for (let i = 0; i < n; i++) {
    const zn = Z.data[i * 4], o = i * 4;
    if (tintes[zn]) { const f = Math.max(.35, Math.min(1.6, lum[i] / ref[zn])), c = tintes[zn]; out.data[o] = Math.min(255, c[0] * f); out.data[o + 1] = Math.min(255, c[1] * f); out.data[o + 2] = Math.min(255, c[2] * f); }
    else if (zn === 5 && u.metal === 'plata') { const f = Math.pow(Math.max(.01, lum[i] / ref[5]), .9); out.data[o] = Math.min(255, 200 * f); out.data[o + 1] = Math.min(255, 205 * f); out.data[o + 2] = Math.min(255, 212 * f); }
  }
  return out;
}
async function dibujarUni(canvas, u) {
  u = Object.assign({}, UDEF, u || {});
  const m = u.modelo;
  const R = await (UN[m] = UN[m] || recursoZonas(`uniformes/uniforme${m}.png`, `uniformes/uniforme${m}_zonas.png`));
  const t = {1: hexRgb(u.chaqueta), 2: hexRgb(u.pantalon)}; if (m >= 2) t[3] = hexRgb(u.corbata); if (m === 3) t[4] = hexRgb(u.cinturon);
  canvas.width = R.A.width; canvas.height = R.A.height;
  const ctx = canvas.getContext('2d'); ctx.putImageData(pinta(R, u, t), 0, 0);
  if (u.gorra) {
    const G = await (GO.g = GO.g || recursoZonas('uniformes/gorra.png', 'uniformes/gorra_zonas.png'));
    const tmp = document.createElement('canvas'); tmp.width = G.A.width; tmp.height = G.A.height;
    tmp.getContext('2d').putImageData(pinta(G, u, {6: hexRgb(u.gorra)}), 0, 0);
    ctx.drawImage(tmp, GPOS[m][0], GPOS[m][1]);
  }
}
const uniHtml = (id, w) => `<canvas class="uni" data-uid="${id}" style="width:${w}px;height:${Math.round(w * 664 / 400)}px"></canvas>`;
async function pintarUnis(mapa, raiz) {
  for (const c of (raiz || document).querySelectorAll('canvas.uni')) {
    const u = mapa[c.dataset.uid]; if (!u) continue;
    try { await dibujarUni(c, u); } catch (e) { c.replaceWith(Object.assign(document.createElement('small'), {textContent: 'Uniforme no disponible'})); }
  }
}

  pintarUnis(mapa, v);
}

let MS = new Set(), MF = 'todas', MT = 'montar', CAT = null;
async function pMontaje() {
  const v = document.getElementById('vista');
  if (!CAT) {
    v.innerHTML = '<section><p class="nota">Cargando marchas…</p></section>';
    const {data, error} = await sb.from('marchas').select('id,titulo,compositor,estilo,propia_de,dedicatoria').order('titulo');
    if (error) return aviso(error.message);
    CAT = data;
  }
  const mias = new Set((B.repertorio || []).map(r => r.marcha_id)), nrep = mias.size, max = MAXREP(), por = P.montajes_por_accion || 2, pr = P.precio_montaje || 150;
  const ens = E.fase === 'ensayo', n = MS.size, libres = max - nrep;
  const base = CAT.filter(m => MT === 'montar' ? !m.propia_de : mias.has(m.id));
  const lista = base.filter(m => MF === 'todas' || (MF === 'fun' ? m.estilo === 'Fúnebre' : m.estilo === 'Alegre'));
  const fila = m => {
    const tengo = mias.has(m.id), sel = MS.has(m.id);
    const btn = MT === 'montar' ? (tengo ? '<button class="mini off" disabled>Ya la tienes</button>' : `<button class="mini ${sel ? 'sel' : ''}" data-id="${m.id}">${sel ? 'Elegida' : 'Elegir'}</button>`) : '';
    return `<div class="fila"><div style="flex:1;min-width:0"><b style="display:block">${h(m.titulo)}</b><small style="color:var(--gris)">${m.propia_de ? 'Propia' + (m.dedicatoria ? ' · ' + h(m.dedicatoria) : '') : h(m.compositor || '')}</small></div><span class="pill ${m.estilo === 'Fúnebre' ? 'p2' : ''}">${m.estilo}</span>${btn}</div>`;
  };
  v.innerHTML = `<section style="background:linear-gradient(160deg,#2a1238,#4a2466);color:#fff"><div class="res"><div><span class="num" style="color:var(--oro2)">${nrep}</span><small style="color:#d8c9e3">marchas en repertorio</small></div><div><span class="num" style="color:var(--oro2)">${max}</span><small style="color:#d8c9e3">máximo en repertorio</small></div></div>
  <p class="nota" style="color:#d8c9e3;margin-top:10px">Cada marcha cuesta ${eur(pr)} y con 1 acción montas hasta ${por}. Solo en día de ensayo (te quedan ${B.acciones} acciones).</p></section>
  <div class="tabs3"><button class="${MT === 'montar' ? 'on' : ''}" data-mt="montar">Montar</button><button class="${MT === 'mi' ? 'on' : ''}" data-mt="mi">Mi repertorio</button></div>
  <section><div class="bt" style="margin-bottom:8px">${[['todas', 'Todas'], ['fun', 'Fúnebres'], ['ale', 'Alegres']].map(([k, t]) => `<button class="seg ${MF === k ? 'on' : ''}" data-f="${k}">${t}</button>`).join('')}</div>
  ${lista.map(fila).join('') || '<p class="nota">No hay marchas.</p>'}
  <p class="nota">${CAT.filter(m => !m.propia_de).length} marchas en el catálogo · te caben ${libres} más · máximo ${por} por acción</p></section>
  <button class="of2" id="vb">Volver a Mi banda</button>
  ${MT === 'montar' ? `<div class="barra-fija"><button class="of" id="mn" ${!n || !ens || B.acciones < 1 || B.dinero < n * pr || n > libres ? 'disabled' : ''}>${n ? `Montar ${n} marcha${n > 1 ? 's' : ''} (1 acción · ${eur(n * pr)})` : 'Elige hasta ' + por + ' marchas'}</button></div>` : ''}`;
  v.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => { MT = b.dataset.mt; pMontaje(); });
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { MF = b.dataset.f; pMontaje(); });
  v.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
    const id = +b.dataset.id; if (MS.has(id)) MS.delete(id); else { if (MS.size >= por) return aviso('Solo puedes elegir ' + por + ' marchas por acción.'); MS.add(id); }
    pMontaje();
  });
  document.getElementById('vb').onclick = () => volver({v: 'mibanda'});
  const mn = document.getElementById('mn');
  if (mn) mn.onclick = async () => {
    mn.disabled = true;
    const {error} = await sb.rpc('montar_marchas', {p_ids: [...MS]});
    if (error) { mn.disabled = false; return aviso(error.message); }
    MS = new Set(); CAT = null; await init();
  };
  if (!ens) aviso('Hoy es día de procesiones: solo puedes montar marchas en día de ensayo.');
}

init();
</script>
